[project]
name = "flow-desk-product-extension"
version = "0.1.0"
description = "Flow Desk product-owned Gateway API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "deerflow-extension-api>=0.2.18,<0.3",
    "fastapi>=0.115.0,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.entry-points."deerflow.extensions"]
flow-desk-product = "flow_desk_product_extension:install"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "aiosqlite>=0.20,<1",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flow_desk_product_extension"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
