  #   #                                # 改用 headless: false 启动 Playwright
  #   #                                # 自带的可视浏览器。
  #   # 多 worker 注意：浏览器会话保存在单个 Gateway worker 的内存里。
  #   # 启用该工具组期间请保持 GATEWAY_WORKERS=1。
  # - name: browser_snapshot
  #   group: browser
