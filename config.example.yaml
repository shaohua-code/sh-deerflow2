  # 并在依赖同步时保留 browser extra。
  #
  # 取消整块注释即可启用。启动与 URL 策略设置以 browser_navigate 为准，
  # 并由所有浏览器工具 + Live 共享。
  # - name: browser_navigate
  #   group: browser
  #   use: deerflow.community.browser_automation.tools:browser_navigate_tool
  #   headless: true                   # 仅在本地可信调试时设为 false
  #   timeout_ms: 30000                # 单次导航/交互超时
  #   viewport_width: 1280
