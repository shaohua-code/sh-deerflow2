  #   use: deerflow.community.infoquest.tools:web_fetch_tool
  #   # 整个抓取流程的总超时（秒）。设为正数启用，-1 关闭
  #   timeout: 10
  #   # 页面加载后的等待时间（秒）。设为正数启用，-1 关闭
  #   fetch_time: 10
  #   # 页面导航超时（秒）。设为正数启用，-1 关闭
  #   navigation_timeout: 30

  # 网页抓取工具（使用 Firecrawl。云版需要 FIRECRAWL_API_KEY；自托管可能无需密钥。）
  # - name: web_fetch
