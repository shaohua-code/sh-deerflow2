  # 图片搜索工具（使用 InfoQuest）
  # - name: image_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:image_search_tool
  #   # 用于限定图片搜索结果范围，只返回指定时间范围内的内容。设为 -1 关闭时间过滤
  #   image_search_time_range: 10
  #   # 图片尺寸过滤。可选值："l"（大图）、"m"（中图）、"i"（图标）。
  #   image_size: "i"

  # 图片搜索工具（使用 Serper——Google 图片 API，需要 SERPER_API_KEY）
  # Serper 提供实时 Google 图片结果。在 https://serper.dev 注册。
  # 注意：启动应用前先在环境中设置 SERPER_API_KEY。
  # 不要把明文 API Key 写进 config.yaml；请使用 $VAR 形式。
  # - name: image_search
  #   group: web
  #   use: deerflow.community.serper.tools:image_search_tool
  #   max_results: 5   # Serper Provider 上限 10
  #   # api_key: $SERPER_API_KEY  # 可选的显式环境变量引用

  # 图片搜索工具（使用 Brave 图片搜索 API，需要 BRAVE_SEARCH_API_KEY）
  # Brave 提供独立的图片结果，可与 Brave 网页搜索工具配合使用。
  # 注意：启动应用前先在环境中设置 BRAVE_SEARCH_API_KEY。
  # 不要把明文 API Key 写进 config.yaml；请使用 $VAR 形式。
  # - name: image_search
  #   group: web
  #   use: deerflow.community.brave.tools:image_search_tool
  #   max_results: 5   # Brave 图片搜索上限 200
  #   # country: US
  #   # search_lang: en
  #   # safesearch: strict
  #   # spellcheck: true
  #   # api_key: $BRAVE_SEARCH_API_KEY  # 可选的显式环境变量引用

  # 文件操作工具
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool

  - name: glob
    group: file:read
    use: deerflow.sandbox.tools:glob_tool
    max_results: 200

  - name: grep
    group: file:read
    use: deerflow.sandbox.tools:grep_tool
    max_results: 100

  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool

  # Bash 执行工具
  # 仅在使用隔离 shell 沙箱，或显式开启 sandbox.allow_host_bash: true
  # 选择宿主机 bash 时才会激活。
  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool

# ============================================================================
# 工具搜索配置（延迟工具加载）
# ============================================================================
# 启用后，MCP 工具不会直接加载进智能体的上下文。
# 而是在系统提示词中按名称列出，运行时通过 tool_search 工具发现。
# 当多个 MCP 服务器暴露大量工具时，这能降低上下文占用并提升工具
# 选择的准确性。

tool_search:
  enabled: false
  # tool_search 启用时，PR1 MCP 路由元数据可在模型调用前自动晋升匹配的
  # 延迟 MCP 工具 schema。这是每次模型调用晋升的匹配 schema 数上限。
  # 有效范围：1..5。
  auto_promote_top_k: 3

# ============================================================================
# 工具输出预算保护
# ============================================================================
# 防止过大的工具结果撑爆模型上下文窗口。
# 超过 `externalize_min_chars` 的输出会持久化到磁盘，并替换为紧凑的
# 带类型摘要 + 文件引用。模型可通过 read_file 读取完整输出。当磁盘
# 持久化不可用时，超过 `fallback_max_chars` 的输出改为头尾截断。
#
# `exempt_tools` 防止读取类工具陷入 持久化→读取→再持久化 的死循环。
# `tool_overrides` 允许按工具自定义阈值。
#
# 同一个中间件还会在模型可见请求中省略成功 write_file 调用的 `content`
# 参数——前提是该路径随后被再次读取或修改（issue #5328）：此时磁盘上
# 的文件才是事实来源，而先读后写门禁本来也要求下次修改前重新读取，
# 历史副本只会白白消耗上下文。存储的历史、回执和运行日志仍保留原始
# 参数。

tool_output:
  enabled: true
  externalize_min_chars: 12000
  # 附加在每个带类型摘要后的内联原始头/尾采样预算；二进制类输出自带
  # 采样，不受此预算约束。
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: ".tool-results"
  exempt_tools:
    - read_file
    - read_file_tool
  # tool_overrides:
  #   web_search: 8000
  #   bash: 20000
  # 当同一路径后续存在成功的 read_file / write_file / str_replace 时，
  # 用一个指向 read_file 的短占位符替换成功 write_file 调用的 `content`。
  # 只有模型可见请求会变化。
  elide_superseded_writes: true
  # 只省略长度不小于该值的 content（按字符数而非 token 计：CJK 文本
  # 每字符成本约是 ASCII 的 3-4 倍）。0 表示省略所有非空 content。
  superseded_write_min_chars: 2000
  # 最近 N 次成功的 write_file 调用（跨所有路径）始终保持可见，即使已
  # 被后续写入取代，模型无需读取也能说出它刚写了什么。0 表示全部不保留。
  keep_recent_writes: 1

# ============================================================================
# 后续问题建议配置
# ============================================================================
# 配置智能体是否在每次回答末尾自动生成后续问题建议。

suggestions:
  enabled: true
  max_suggestions: 3


# ============================================================================
# 输入润色配置
# ============================================================================
# 配置输入框是否可以在发送前改写草稿。

input_polish:
  enabled: true
  # /api/input-polish 接受的最大草稿长度。
  max_chars: 4000
  # 用于润色草稿的快速模型（可选）。保持 null 则使用默认对话模型。
  # 为获得最佳体验，建议配置为延迟最低的廉价模型。
  model_name: null


# ============================================================================
# 循环检测配置
# ============================================================================
# 检测并中断重复的相同工具调用循环。
# 频次阈值是对重复使用同一工具类型的安全限制。

loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  # 兼容命名：限制的是保留的 (thread_id, run_id) 历史条数，不是整个线程。
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
  # tool_freq_warn / tool_freq_hard_limit 的按工具覆盖。取值可高于或低于
  # 全局默认。常用于为批量工作流（如 RNA-seq 流水线）中的 bash 等高频
  # 工具放宽阈值，而不削弱其他工具的保护。
  # tool_freq_overrides:
  #   bash:
  #     warn: 150
  #     hard_limit: 300

# ============================================================================
# 工具进度状态机配置（RFC #3177）
# ============================================================================
# 在（线程, 工具）级别检测工具停滞与重复。
# 跟踪连续的"无新信息"调用（错误、部分成功、近似重复的成功）。
# 三条转移路径（由 deerflow_tool_meta.recoverable_by_model 决定）：
#   recoverable=true  (no_results, not_found, permission): ACTIVE → WARNED（终态；每次调用重新注入提示）
#   recoverable=false (rate_limited, transient):           ACTIVE → WARNED → 再犯 warn_escalation_count 次后 BLOCKED
#   recoverable=false + action=stop (auth, config):        ACTIVE → 直接 BLOCKED
# 需要 ToolErrorHandlingMiddleware 处于激活状态（始终开启）。

# tool_progress:
#   enabled: false
#   stagnation_threshold: 3        # 进入 WARNED 前的连续问题次数
#   warn_escalation_count: 2       # WARNED 之后、BLOCKED 之前的问题次数
#   inject_assessment: true
#   jaccard_similarity_threshold: 0.8  # 近似重复检测的词集相似度阈值
#   min_word_count_for_similarity: 10  # 应用 Jaccard 检查的最少去重词数
#   max_tracked_threads: 100
#   exempt_tools:
#     - ask_clarification
#     - write_todos
#     - present_files
#     - task

# ============================================================================
# 先读后写文件门禁（issue #3857）
# ============================================================================
# 除非智能体先读过文件的当前版本，否则拦截 write_file（对已有文件的
# 追加/覆盖）和 str_replace；任何写入都会使先前的读取失效，迫使连续
# 编辑之间必须重新读取。针对长任务中盲目的重复追加提供确定性护栏。

read_before_write:
  enabled: true
  # 被拦截的调用从未执行，重新读取后必须重新发起，因此其载荷
  # （write_file 的 content、str_replace 的 old_str/new_str）在此后的每次
  # 模型调用中都是死重。模型可见请求中会替换为短占位符；存储的历史、
  # 回执和运行日志保留原始内容。
  elide_blocked_payloads: true
  # 只省略长度不小于该值的载荷字段（按字符数而非 token 计：CJK 文本
  # 每字符成本约是 ASCII 的 3-4 倍）。0 表示省略所有非空载荷。
  elide_min_chars: 2000

# ============================================================================
# 项目
# ============================================================================
# 用户项目把若干线程归到同一个名称 + 自由格式指令之下。成员线程会
# 收到项目当前指令，呈现为一个有界的请求级 <project> 块，内容渲染自
# 运行准入时固定的快照；该块不会进入系统提示词或持久化历史。下方
# 资料架索引上限约束从同一固定快照渲染的请求级 <documents> 列表。
# 超长指令在写入时被拒绝（422），从不截断。

projects:
  # 项目指令的 UTF-8 字节硬上限（范围：256-262144）。多字节字符按其
  # UTF-8 字节长度计数，不按字符数。
  instructions_max_bytes: 8192
  # 每次运行渲染进 <documents> 索引的资料架条目上限（范围：1-500）。
  shelf_index_max_entries: 50
  # 渲染后的 <documents> 索引的 UTF-8 字节上限，统计 ID、转义名称、
  # 包装符、分隔符和溢出提示（范围：512-65536）。
  # 对 CJK 文档名，通常先于条目数上限触顶。
  shelf_index_max_bytes: 4096
  # 回收站中的项目文档在保留期清扫允许永久清除前可恢复的天数
  # （范围：1-3650）。
  trash_retention_days: 30

# ============================================================================
# Provider 安全终止配置
# ============================================================================
# 拦截 Provider 因安全原因停止生成但仍返回 tool_calls 的 AIMessage
# （如 OpenAI 的 finish_reason='content_filter'、Anthropic 的
# stop_reason='refusal'、Gemini 的 finish_reason='SAFETY'）。这类响应中的
# tool_calls 通常被截断/不可靠，绝不能执行。完整失败模式见 issue #3028。
#
# 检测器通过反射按类路径加载（与护栏/模型/工具同一模式）。内置集合
# 覆盖 OpenAI 兼容的 content_filter、Anthropic 的 refusal，以及 Gemini 的
# SAFETY/BLOCKLIST/PROHIBITED_CONTENT/SPII/RECITATION。

safety_finish_reason:
  enabled: true
  # 保持 `detectors` 不配置即使用内置检测器集合。设为非空列表会完全
  # 覆盖内置集合（要禁用请用 `enabled: false`，不要给空列表）。
  #
  # 示例——为某家网关使用非标准 finish_reason 词元的国内 Provider
  # 扩展 OpenAI 兼容检测器：
  # detectors:
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:OpenAICompatibleContentFilterDetector
  #     config:
  #       finish_reasons: ["content_filter", "sensitive", "risk_control"]
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:AnthropicRefusalDetector
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:GeminiSafetyDetector
  #
  # 示例——为自研 Provider 添加自定义检测器：
  # detectors:
  #   - use: my_company.deerflow_ext:WenxinSafetyDetector
  #     config:
  #       error_codes: [336003, 17, 18]

# ============================================================================
# 沙箱配置
# ============================================================================
# 在本地沙箱（直接执行）与基于 Docker 的 AIO 沙箱之间选择

# 方式一：本地沙箱（默认）
# 直接在宿主机上执行命令
uploads:
  # 应用层的上传限额，由 Gateway 强制执行，并在前端选择文件前展示。
  max_files: 10
  max_file_size: 52428800    # 50 MiB
  max_total_size: 104857600  # 100 MiB
  # Office/PDF 自动转换在后端主机上执行，先于沙箱隔离生效。除非上传
  # 来自完全可信的来源、且你有意接受宿主机解析器风险，否则保持关闭。
  auto_convert_documents: false
  # 控制 PDF 转换执行时使用哪个 PDF 转 Markdown 转换器。上传自动转换
  # 由 auto_convert_documents 单独开关。
  # auto        — 已安装 pymupdf4llm 时优先使用；对图像型或加密 PDF 回退
  #               到 MarkItDown（推荐默认值）。
  # pymupdf4llm — 始终使用 pymupdf4llm（需安装：uv add pymupdf4llm）。
  #               标题/表格提取更好；对多数文件更快。
  # markitdown  — 始终使用 MarkItDown（原始行为，无额外依赖）。
  pdf_converter: auto

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  # 宿主机 bash 执行默认关闭，因为 LocalSandboxProvider 不是 shell 访问
  # 的安全隔离边界。仅在完全可信的单用户本地工作流中启用。
  allow_host_bash: false
  # 可选：把宿主机其他目录挂载进沙箱。
  # 每个挂载把一个宿主机路径映射为智能体可访问的虚拟容器路径。
  # 注意：在 `make up`（docker-compose）下使用 LocalSandboxProvider 时，
  # host_path 是从 deer-flow-gateway 容器内部检查的——你还必须把同一
  # 目录 bind-mount 进 docker/docker-compose.yaml 的
  # services.gateway.volumes，这个挂载才会生效（见 issue #3244）。
  # mounts:
  #   - host_path: /home/user/my-project    # 绝对路径；Docker 模式见上方说明
  #     container_path: /mnt/my-project     # 沙箱内的虚拟路径
  #     read_only: true                     # 是否只读（默认：false）

  # 工具输出截断上限（字符数）。
  # bash 采用中段截断（头 + 尾），因为错误可能出现在输出的任何位置。
  # read_file 和 ls 采用头部截断，因为其内容集中在前部。
  # 预算允许时，read_file 的截断会落在行边界上，且截断标记会指出下次
  # 继续的 start_line，智能体因此可以精确地翻页读取长文件。
  # 设为 0 关闭截断。
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

  # 单条宿主机 bash 命令被终止（连同整个进程组）前最大可运行的墙钟
  # 秒数。阻塞式前台命令——例如未放后台的服务——超过此时长即被杀死，
  # 避免智能体回合卡死。需要日志时，把长驻进程放到后台并重定向输出
  # （如 `your-command > /tmp/server.log 2>&1 &`）；未重定向的后台输出
  # 会被有界捕获并丢弃超量部分。
  bash_command_timeout: 600

# 方式二：基于容器的 AIO 沙箱
# 在隔离容器中执行命令（Docker 或 Apple Container）
# macOS：可用时优先 Apple Container，但在模式切换后该沙箱前缀仍有
# 托管 Docker 容器待收敛期间继续使用 Docker
# 其他平台：使用 Docker
# 取消注释即可启用：
# sandbox:
#   use: deerflow.community.aio_sandbox:AioSandboxProvider
#
#   # 可选：使用的容器镜像（Docker 与 Apple Container 通用）
#   # 默认：enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
#   # 该镜像的 `:latest` 标签冻结在 1.9.3 之前的旧 digest 上，缺少
#   # required-secrets 技能所需的 /v1/bash/* 路由（见 #3921/#3922），因此
#   # 请固定明确的版本——推荐 1.11.0（多架构，x86_64 与 arm64 均可用）。
#   # 自定义镜像应基于默认镜像扩展，或实现与 agent-sandbox 相同的
#   # AIO 沙箱 HTTP API。见 backend/docs/CONFIGURATION.md。
#   # image: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0
#
#   # 可选：沙箱容器的基础端口（默认：8080）
#   # port: 8080

#   # 可选：并发沙箱容器上限（默认：3）
#   # 达到上限时，最近最少使用的沙箱会被逐出，为新沙箱腾出空间。
#   # 这里用正整数；省略该字段即使用默认值。
#   # replicas: 3
#
#   # 可选：容器名前缀（默认：deer-flow-sandbox）
#   # container_prefix: deer-flow-sandbox
#
#   # 可选：本地托管 Docker 沙箱的出站网络策略。
#   # open 保持现有行为。isolated 拒绝所有出站流量。
#   # allowlist 只放行列出的 HTTP/HTTPS 域名；被拒的公网域名可以选择
#   # 在"人工输入"卡片中批准。受限模式要求 Docker Engine 28+，
#   # Apple Container 和 provisioner 模式不支持。
#   # 私网、回环、链路本地、多播及云元数据地址始终拒绝。
#   network:
#     mode: allowlist                    # open | isolated | allowlist（默认：open）
#     allow_domains:
#       - pypi.org
#       - files.pythonhosted.org
#       - registry.npmjs.org
#       - github.com
#     approval: prompt                  # deny | prompt
#     temporary_grant_ttl: 300          # 30-3600 秒
#     proxy_image: ghcr.io/bytedance/deer-flow-sandbox-network-proxy:latest
#
#   # 可选：覆盖"沙箱已经通过共享挂载看到 Gateway 的线程
#   # workspace/uploads/outputs"这一判定。
#   # 省略该字段则由后端自动探测（本地容器：true；远程/provisioner
#   # 后端：false）。仅当部署保证两侧使用相同的线程用户数据目录时
#   # （如对齐的共享 PVC、NFS 卷、hostPath 或 bind mount）才设 true。
#   # true 跳过每次上传的沙箱获取/同步；false 强制显式同步。
#   # thread_data_mounts: true
#
#   # 可选：宿主机到容器的额外挂载目录
#   # 注意：技能目录会按 skills.path → skills.container_path 自动挂载
#   # mounts:
#   #   # 其他自定义挂载
#   #   - host_path: /path/on/host
#   #     container_path: /home/user/shared
#   #     read_only: false
#   #
#   #   # DeerFlow 会把配置的 container_path 展示给智能体，
#   #   # 因此它可以直接读写 /home/user/shared 等挂载目录
#
#   # 可选：注入沙箱容器的环境变量
#   # 以 $ 开头的值会从宿主机环境变量解析
#   # AIO 语义化版本镜像默认 MAX_SHELL_SESSIONS=10。只要
#   # subagent_runtime.max_running + 1 放得下，DeerFlow 保留镜像默认值；
#   # 否则会为本地和 provisioner 沙箱注入所需值。
#   # 允许显式设置，但必须不小于 max_running + 1。
#   # environment:
#   #   MAX_SHELL_SESSIONS: "13"  # 对应 subagent_runtime.max_running: 12 的示例
#   #   NODE_ENV: production
#   #   DEBUG: "false"
#   #   API_KEY: $MY_API_KEY        # 读取宿主机的 MY_API_KEY 环境变量
#   #   DATABASE_URL: $DATABASE_URL  # 读取宿主机的 DATABASE_URL 环境变量
#   #   # 使用 OpenAI 兼容图像生成 Provider 时必填：
#   #   IMAGE_GENERATION_PROVIDER: $IMAGE_GENERATION_PROVIDER
#   #   IMAGE_GENERATION_API_KEY: $IMAGE_GENERATION_API_KEY
#   #   IMAGE_GENERATION_BASE_URL: $IMAGE_GENERATION_BASE_URL
#   #   IMAGE_GENERATION_MODEL: $IMAGE_GENERATION_MODEL
#   #   IMAGE_GENERATION_SIZE: $IMAGE_GENERATION_SIZE  # 可选的固定尺寸覆盖
#
#   # 可选：跨实例容器归属（issue #4206）。
#   #
#   # 多个 Gateway 实例共享沙箱容器，但各自维护进程内的热池。没有共享
#   # 归属状态时，一个实例的启动收敛可能收养另一个实例正在使用的容器，
#   # 随后闲置销毁它——工具调用随即以 502 / 连接拒绝失败。
#   #
#   # 只跑一个 Gateway 实例？保持不配置即可；默认 `memory`，不会发生
#   # 跨实例误杀。
#   #
#   # 多个 Gateway 实例 / worker 共用一个容器后端（负载均衡部署、
#   # Docker Compose）必须设 type: redis。Docker Compose 已经设置了
#   # DEER_FLOW_STREAM_BRIDGE_REDIS_URL，它会被当作多实例部署的标志，
#   # 因此即使省略本节也会推断为 redis 归属。
#   #
#   # redis 归属存储需要可选的 `redis` extra。`make dev` 会根据本节自动
#   # 探测安装；Docker 镜像中始终已安装。手动安装：
#   #     cd backend && uv sync --all-packages --extra redis
#   #
#   # ownership:
#   #   type: memory                 # 仅限单 Gateway 实例
#   #
#   # ownership:
#   #   type: redis                  # 多实例 / 负载均衡必用
#   #   redis_url: redis://redis:6379/0
#   #   renewal_interval_seconds: 30 # 归属方刷新租约的频率
#   #   ttl_multiplier: 4            # 租约 TTL = 间隔 x 该值（最小 2，避免
#   #                                # 单次续租失败就让活跃归属方过期）。
#   #                                # 存活判定刻意独立于 idle_timeout：
#   #                                # 即使 idle_timeout: 0，续租仍在运行。
#   #   key_prefix: deerflow:sandbox:owner
#   #
#   # 注意：redis 归属存储是 fail-closed 的，与流桥接的 fail-hard 策略
#   # 一致。Redis.from_url 是惰性的，Redis 宕机不会阻塞启动，但无法发布
#   # 归属信息的沙箱不会被分发——获取时直接抛错。另一种选择（无归属
#   # 继续用）正是 #4206 的跨实例误杀场景。请以 HA / 自动重启策略运行
#   # Redis。
#   #
#   # 注意：另一个边界是租约 TTL（renewal_interval_seconds x
#   # ttl_multiplier）。超过一个 TTL 的 Redis 故障可能让收敛中的实例
#   # 收养活跃归属方的容器：过期租约与死亡归属方无法区分，因此一个
#   # TTL 的收养宽限就是全部安全余量。请按你的 Redis 可用性目标设定
#   # TTL（HA Redis 可以把这个窗口压到够不着）。

# 方式三：BoxLite 微虚拟机沙箱
# 每个沙箱运行为一个 BoxLite 微虚拟机。释放的盒子留在进程内热池中，
# 同一用户/线程可无冷启动复用。需要 boxlite 运行时和宿主机虚拟化支持
# （Linux 上为 KVM，macOS 上为 Hypervisor.framework）。
# sandbox:
#   use: deerflow.community.boxlite:BoxliteProvider
#   image: python:3.12-slim
#
#   # 可选：每个盒子的内存与 CPU 限额。
#   # memory_mib: 1024
#   # cpus: 2
#
#   # 可选：每个 Gateway 进程活跃 + 热池 BoxLite 虚拟机上限（默认：3）。
#   # 活跃盒子永不被逐出；只会停掉热池盒子腾出空间。
#   # replicas: 3
#
#   # 可选：热池虚拟机空闲多少秒后被停止（默认：600）。
#   # 设为 0 则热池虚拟机保持到关机或被逐出为止。
#   # idle_timeout: 600
#
#   # 可选：对刚释放的虚拟机跳过复用健康检查。
#   # 默认 0.0 表示热复用前仍做可靠性优先的校验。
#   # health_check_skip_seconds: 0.0
#
#   # 可选：注入每条命令的环境变量。
#   # environment:
#   #   PYTHONUNBUFFERED: "1"
#
# 方式四：Provisioner 托管的 AIO 沙箱（docker-compose-dev）
# 每个 sandbox_id 在 k3s 中获得一个专属 Pod，由 provisioner 管理。
# 推荐给需要更强隔离与扩展性的生产环境或高级用户：
# sandbox:
#   use: deerflow.community.aio_sandbox:AioSandboxProvider
#   provisioner_url: http://provisioner:8002
#   # provisioner 认证的 API key。必须与 provisioner 容器上设置的
#   # PROVISIONER_API_KEY 一致。两侧必须配置相同的值；未设置
#   # PROVISIONER_API_KEY 时 provisioner 拒绝所有 /api/* 请求。
#   # 生成强密钥：openssl rand -hex 32
#   # provisioner_api_key: $PROVISIONER_API_KEY
#   # 注意：provisioner 创建的 Pod 使用 provisioner 的 SANDBOX_IMAGE
#   # 环境变量，而不是本配置文件的 sandbox.image。

# 方式五：Tenki 云微虚拟机沙箱
# 每个沙箱运行为隔离的 Tenki 云微虚拟机。释放的沙箱留在进程内热池，
# 同一用户/线程可无冷启动复用。需要可选 SDK：pip install "deerflow-harness[tenki]"。
# sandbox:
#   use: deerflow.community.tenki:TenkiSandboxProvider
#   # api_key: $TENKI_API_KEY        # 回退到 TENKI_API_KEY / TENKI_AUTH_TOKEN 环境变量
#   # base_url: https://tenki.cloud  # 可选；省略时用 SDK 默认值
#   # image: my-base-image           # 可选；省略时用 Tenki 账户默认基础镜像
#   # workspace_id: ws_...           # 可选；账户恰好只有一个工作区时自动选择
#   # 迁移说明：sandbox.project_id 已移除——Tenki 1.x 取消了项目，作用域
#   # 只剩工作区。账户有多个工作区时请设置 workspace_id。
#   # 遗留的 project_id 会被忽略并在启动时记一条警告。
#   # cpu_cores: 2                   # 可选，每个沙箱的 vCPU 数
#   # memory_mb: 2048                # 可选，每个沙箱的内存
#   # replicas: 3                    # 每个 Gateway 进程活跃 + 热池微虚拟机上限
#   # idle_timeout: 600              # 热池微虚拟机销毁前的空闲秒数；0 关闭
#   # max_duration: 14400            # Tenki 沙箱生命周期（秒）；0 使用账户默认
#   # sticky: false                  # 把微虚拟机固定在其宿主机（仅暂停/恢复场景相关）
#   # home_dir: /home/tenki          # 支撑 /mnt/user-data 的可写目录
#   # environment:                   # 注入每条命令（同时作为创建时环境变量）
#   #   PYTHONUNBUFFERED: "1"

# 方式六：OpenSandbox 远程沙箱
# 每个沙箱通过一台 OpenSandbox 服务器运行。释放的沙箱留在进程内热池，
# 仅同一用户/线程可复用。需要可选 SDK：pip install "deerflow-harness[opensandbox]"。
# sandbox:
#   use: deerflow.community.opensandbox:OpenSandboxProvider
#   image: python:3.11
#   # api_key: $OPEN_SANDBOX_API_KEY  # SDK 环境变量已设置时可省略
#   # domain: localhost:8080          # 可选；回退到 OPEN_SANDBOX_DOMAIN
#   # protocol: http                  # 仅限 localhost；远程域名请用 https
#   # request_timeout: 30             # 管理 API 请求超时（秒）
#   # ready_timeout: 30               # 创建/就绪超时（秒）
#   # use_server_proxy: false         # execd/文件流量经服务器代理
#   # sandbox_timeout: 14400          # 远程生命周期（秒）；0 = 显式清理
#   # bash_command_timeout: 600       # 默认远程命令超时（秒）
#   # replicas: 3                     # 每个 Gateway 进程活跃 + 热池上限
#   # idle_timeout: 600               # 销毁前的热池空闲秒数；0 关闭
#   # environment:                    # 创建时与每条命令的默认环境变量
#   #   PYTHONUNBUFFERED: "1"

# ============================================================================
# 子智能体配置
# ============================================================================
# 配置子智能体执行的超时
# 子智能体是由主智能体委派任务的后台 worker

# 进程级执行容量。这些字段需要重启生效，由普通 `task` 调用与持久批次
# 共享。等待中的任务是异步的；排队的子智能体不占用调度线程。
subagent_runtime:
  max_running: 3
  max_queued: 64
  admission_policy: queue       # 槽位占满时排队或拒绝
  queue_timeout_seconds: 300

# subagents:
#   # 内置子智能体的默认超时（秒）（默认：1800 = 30 分钟）。
#   # 自定义智能体使用自己的 timeout_seconds（默认 900），除非在此覆盖。
#   timeout_seconds: 1800
#   # 可选的全局子智能体最大回合覆盖。一个回合 = 一次模型调用加上它
#   # 触发的工具；回合数会换算成 LangGraph 的步数预算，因此这就是你
#   # 实际能拿到的回合数。
#   # 内置默认：general-purpose=150、bash=60。保持不配置即沿用默认。
#   # max_turns: 120
#
#   # 单次主智能体运行允许的子智能体委派总数。
#   # 这是对"规划检查点反复触发合法规模批次"的确定性兜底。
#   # 默认 6 允许在默认并发 3 下跑满两个完整批次。有效范围：1-50。
#   # 请求级运行上下文可用 `max_total_subagents` 临时覆盖，
#   # 同样被限制在 1-50 范围内。
#   max_total_per_run: 6
#
#   # 子智能体的单次运行 token 上限（#3875 Phase 2）。防止子智能体在
#   # 琐碎工作上烧 token 的兜底。触达硬停止阈值时，进行中的回合被封顶
#   # （剥离工具调用、finish_reason 强制为 "stop"），让运行以最终回答
#   # 自然收尾；结果标记为 `completed` + `subagent_stop_reason=token_capped`，
#   # 主智能体与界面能区分预算封顶的完成与干净完成。默认 2,000,000 是
#   # 宽松上限——收紧成本控制请调低。按智能体的 `token_budget` 覆盖
#   # （见下方 `agents:`）优先于本值。
#   # token_budget:
#   #   enabled: true
#   #   max_tokens: 2000000
#   #   warn_threshold: 0.7     # 花掉该比例预算时记录一次警告
#
#   # 可选的按智能体覆盖（同时作用于内置与自定义智能体）
#   agents:
#     general-purpose:
#       timeout_seconds: 2700  # 极长深度研究任务给 45 分钟
#       max_turns: 250         # 极深任务调高到 250（默认 150）
#       # token_budget:        # 对上方全局 token_budget 的按智能体覆盖
#       #   max_tokens: 3000000  # 为深度研究任务调高上限
#       # model: qwen3:32b     # 指定模型（默认：继承主智能体）
#       # skills:               # 技能发现/激活白名单（默认：全部启用）
#       #   - web-search
#       #   - data-analysis
#     bash:
#       timeout_seconds: 300   # 快速命令执行给 5 分钟
#       max_turns: 80
#       # skills: []            # bash 智能体不发现/激活任何技能
#
#   # 自定义子智能体类型：定义带专属提示词、工具、技能和模型配置的
#   # 专用智能体。自定义智能体与内置类型（general-purpose、bash）一起
#   # 通过 `task` 工具使用。
#   # custom_agents:
#   #   analysis:
#   #     description: "处理数据集并产出洞察的数据分析专家"
#   #     system_prompt: |
#   #       你是数据分析子智能体。专注于：
#   #       - 处理与分析数据集
#   #       - 生成可视化
#   #       - 提供统计洞察
#   #     tools:                  # 工具白名单（null = 继承全部）
#   #       - bash
#   #       - read_file
#   #       - write_file
#   #     skills:                 # 技能发现/激活白名单（null = 全部，[] = 无）
#   #       - data-analysis
#   #       - visualization
#   #     model: inherit          # 'inherit' 使用父智能体的模型
#   #     max_turns: 80
#   #     timeout_seconds: 600
#
#   # 模型覆盖：默认情况下子智能体继承主智能体的模型。
#   # 设置 `model` 可改用其他模型（例如为省成本用本地 Ollama 模型）。
#   # 模型名必须与上方 `models:` 中定义的名称一致。

# 持久化原生子智能体批次。默认关闭：开启会显著增加模型用量，
# 且要求 database.backend 为 sqlite/postgres。
# 三个限额刻意分开：
# - total：单个批次内全部持久化条目
# - live：同一时刻被准许为 queued/running 的待办工作
# - running：单个批次允许占用真实执行槽位的条目
subagent_batches:
  enabled: false
  poll_interval_seconds: 1
  lease_seconds: 120
  max_items_per_batch: 5000
  default_max_live_items: 100
  max_live_items_per_batch: 1000
  default_max_running_items: 3
  max_running_items_per_batch: 64
  max_attempts: 3
  max_result_chars: 100000
  result_preview_max_chars: 2000

# ============================================================================
# 工具结果验证
# ============================================================================
# 确定性回执会盖在工具结果上并注入模型上下文，让最终报告可以引用
# 已执行的动作。不想要这部分溯源上下文时才关闭。选择性裁判设置
# 预留给验收标准审查，默认保持关闭。
verification:
  receipts_enabled: true
  # 主链回执账本渲染：'delegation_only' 仅在处理子智能体结果时渲染
  # （子智能体链始终渲染）。
  receipts_render_mode: "delegation_only"
  judge_enabled: false
  judge_model_name: null

# ============================================================================
# ACP 智能体配置
# ============================================================================
# 为内置的 `invoke_acp_agent` 工具配置外部 ACP 兼容智能体。

# acp_agents:
#   mcode:
#     # MiniMax Code 直接讲 ACP；无需适配器包。
#     # 安装 `npm install --global @minimax-ai/code`，然后运行 `mcode login`。
#     command: mcode
#     args: ["acp"]
#     description: MiniMax Code，用于实现、重构、调试与仓库任务
#     # auto_approve_permissions: false  # 仅对需要 MCode 编辑文件或执行命令的可信任务开启
#     # timeout_seconds: 1800            # 超时未响应则中止并杀死子进程（默认：1800 = 30 分钟）
#
#   claude_code:
#     # DeerFlow 这里需要一个 ACP 适配器。标准 `claude` CLI 不直接讲 ACP。
#     # 请单独安装 `claude-agent-acp`，或使用：
#     command: npx
#     args: ["-y", "@zed-industries/claude-agent-acp"]
#     description: Claude Code，用于实现、重构与调试
#     model: null
#     # auto_approve_permissions: false  # 设为 true 自动批准 ACP 权限请求
#     # timeout_seconds: 1800            # 超时未响应则中止并杀死子进程（默认：1800 = 30 分钟）
#     # env:                             # 可选：注入智能体子进程的环境变量
#     #   ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY  # $VAR 从宿主机环境解析
#
#   codex:
#     # DeerFlow 这里需要一个 ACP 适配器。标准 `codex` CLI 不直接讲 ACP。
#     # 请单独安装 `codex-acp`，或使用：
#     command: npx
#     args: ["-y", "@zed-industries/codex-acp"]
#     description: Codex CLI，用于仓库任务与代码生成
#     model: null
#     # auto_approve_permissions: false  # 设为 true 自动批准 ACP 权限请求
#     # env:                             # 可选：注入智能体子进程的环境变量
#     #   OPENAI_API_KEY: $OPENAI_API_KEY  # $VAR 从宿主机环境解析

# ============================================================================
# 技能配置
# ============================================================================
# 配置技能目录，支撑专项智能体工作流

skills:
  # 宿主机上技能目录的路径（相对项目根或绝对路径）
  # 默认：项目根目录下的 skills
  # 省略该字段时可用 DEER_FLOW_SKILLS_PATH 覆盖。
  # 取消注释以自定义：
  # path: /absolute/path/to/custom/skills

  # 技能挂载到沙箱容器内的路径
  # 智能体在本地与 Docker 沙箱中都用它访问技能。
  # AIO/provisioner 与 E2B 模式要求一个规范的、绝对、非 root、且不与
  # 平台保留挂载重叠的路径。Provider 会对该路径做身份、挂载、元数据与
  # 同步快照，因此修改后需重启 Gateway。
  # 默认：/mnt/skills
  container_path: /mnt/skills

  # 延迟技能发现（默认：false）
  # 启用后系统提示词（<skill_index>）只出现技能名称。
  # LLM 按需通过 describe_skill 工具发现技能详情。
  # 安装大量技能时，这让系统提示词保持紧凑且利于前缀缓存。
  # deferred_discovery: true

# ============================================================================
# SkillScan 配置
# ============================================================================
# 原生确定性技能安全扫描。在技能安装/更新以及智能体自管的技能写入
# 之前运行，先于 LLM 技能扫描器。
skill_scan:
  # 设为 false 可关闭新的确定性分析器（嵌套压缩包、密钥模式及其他
  # 内容级检查）。安全的压缩包解压（路径穿越、符号链接、可执行文件、
  # 总大小与条目数限制）和 LLM 技能扫描器仍无条件运行。
  enabled: true

# 注意：要限制某个自定义智能体加载哪些技能，请在该智能体的
# `config.yaml`（如 `agents/my-agent/config.yaml`）中定义 `skills` 列表：
# - 省略或 null：加载所有全局启用的技能（默认）
# - []：对该智能体禁用全部技能
# - ["skill-name"]：只加载指定技能

# ============================================================================
# 标题生成配置
# ============================================================================
# 会话标题自动生成设置

title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null # null = 快速本地回退；配置模型名则改用 LLM 生成标题

# ============================================================================
# 摘要配置
# ============================================================================
# 在接近 token 上限时自动总结会话历史
# 帮助长会话维持上下文而不超出模型限制

# 可选的任务接续笔记与压缩消息的关键词回溯。见 docs/任务接续.md。
task_continuity:
  enabled: false
  max_batches: 32
  max_records_per_batch: 256
  max_record_chars: 16000

summarization:
  enabled: true

  # 用于摘要的模型。
  #   null = 用该次运行实际使用的模型做摘要（主运行的模型、子智能体
  #          自己的模型或线程的自定义智能体模型），而不是 models[0]。
  #   设置 = 由该模型生成；若其 Provider 故障，压缩回退到运行自身模型，
  #          坏掉的摘要 Provider 不会导致压缩功能整体失效。
  # 建议：使用 "gpt-4o-mini" 之类的轻量高性价比模型
  model_name: null

  # 触发条件 - 至少需要一个
  # 任一阈值满足即运行摘要（或逻辑）
  # 可以只写一个触发器，也可以是触发器列表
  trigger:
    # token 数达到 32000 时触发
    - type: tokens
      value: 32000
    # 取消注释以在消息数达到 50 时也触发
    # - type: messages
    #   value: 50
    # 取消注释以在达到模型最大输入 token 的 80% 时触发。
    # 该百分比从"摘要模型"声明的 `context_window` 解析
    # （配置了 summarization.model_name 则用它，否则用运行自身模型）：
    # 请在对应 models 条目上声明——第三方 OpenAI 兼容模型没有内置
    # profile。没有它时 fraction 子句会被丢弃并告警，其余绝对阈值子句
    # 继续生效。如果配置了更大窗口的独立摘要模型，请改为按运行模型
    # 尺寸设定绝对 `tokens` 阈值。
    # - type: fraction
    #   value: 0.8

  # 摘要后的上下文保留策略
  # 指定保留多少近期历史
  keep:
    # 保留最近 10 条消息（推荐）
    type: messages
    value: 10
    # 备选：保留指定 token 数
    # type: tokens
    # value: 3000
    # 备选：保留模型最大输入 token 的百分比
    # type: fraction
    # value: 0.3

  # 准备送摘要的消息时最多保留的 token 数
  # 设为 null 跳过裁剪（超长会话不建议）
  trim_tokens_to_summarize: 15564

  # 自定义摘要提示词模板（null = 使用默认 LangChain 提示词）
  # 该提示词应引导模型提取重要上下文
  summary_prompt: null

  # 已加载 SKILL.md 的引用（skills.container_path 下的 read_file 调用）
  # 会记入持久的 skill_context 通道，压缩后以名称/路径/描述提醒的形式
  # 重新注入。技能正文本身不持久化；智能体应在应用指令前重新读取文件。
  # 计为技能读取的工具名：
  # 旧的 preserve_recent_skill_* 摘要设置已不再使用；技能保留改由这个
  # 持久引用通道处理。把该列表设为 [] 可关闭持久技能引用捕获。
  skill_file_read_tool_names:
    - read_file
    - read
    - view
    - cat

# ============================================================================
# 记忆配置
# ============================================================================
# 全局记忆机制（可插拔 + 自包含）。
#
# 共享字段（宿主层，与后端无关）：
#   enabled             - 记忆机制总开关（调用点门控）
#   injection_enabled   - 是否把记忆注入系统提示词（调用点门控）
#   shutdown_flush_timeout_seconds - Gateway 优雅关机时清空待处理更新的硬预算（秒）（默认：30）
#   manager_class       - 后端选择器：注册名（deermem/mem0/noop/openviking）或点分路径
#   backend_config      - 后端私有配置字典（原样透传；各后端自行解释）
#
# DeerMem 私有字段位于 ``backend_config`` 之下（不在 memory: 顶层）：
#   storage_path        - 数据根目录。空 = deer-flow base_dir（工厂注入绝对
#                         runtime_home）。绝对路径 = 以该路径为根。相对路径 = 相对 CWD。
#   model               - 记忆提取的 LLM 配置：{provider, model, api_key, base_url,
#                         temperature}。全部省略 = 不做提取（非 LLM 操作仍可用）。
#   debounce_seconds    - 处理排队更新前的防抖等待（默认：30）
#   max_facts           - 最大存储事实数（默认：100）
#   fact_confidence_threshold - 存储事实的最低置信度（默认：0.7）
#   max_injection_tokens     - 记忆注入的 token 预算（默认：2000）
#   token_counting          - tiktoken（精确，首次使用需联网）或 char（免网络）
#   guaranteed_categories   - 始终注入的事实类别（默认：["correction"]）
#   guaranteed_token_budget - 保证类别的 token 上限（默认：500）
#   staleness_review_enabled       - 启用过期修剪（默认：true）
#   staleness_age_days             - 过期候选的年龄阈值（默认：90）
#   staleness_min_candidates       - 触发审查的最少过期事实数（默认：3）
#   staleness_max_removals_per_cycle - 每轮移除的安全上限（默认：10）
#   staleness_protected_categories - 免于过期审查的类别（默认：["correction"]）
#   staleness_max_lifetime_multiplier - 为 LLM 赋予 expected_valid_days 的事实
#                                       设创建期上限倍数；新事实被钳制到
#                                       staleness_age_days x 倍数。默认 20.0
#                                       （90 x 20 = 1800 天 ≈ 5 年），支持非常
#                                       稳定的提示层级。（默认：20.0，范围：1.0-100.0）
#   staleness_max_extension_days   - 生命周期延长（staleFactsToExtend）后
#                                    expected_valid_days 的绝对上限（天）。
#                                    防止 timedelta 溢出或 LLM 误判把一个事实
#                                    无限推迟。（默认：3650，范围：90-36500）
memory:
  enabled: true
  injection_enabled: true # 是否把记忆注入系统提示词
  # Gateway 优雅关机时清空待处理记忆更新的硬预算（秒）。每个待处理条目
  # 需要一次 LLM 调用，大批量 IM 更新可能需要更长。必须在 Pod 的
  # K8s terminationGracePeriodSeconds 之内（渠道停止 + 本次清空 + 余量），
  # 否则 K8s 会 SIGKILL 清空过程——请在 gateway 的 Helm 部署上设置
  # （见 deploy/helm/deer-flow）。默认 30 秒。
  shutdown_flush_timeout_seconds: 30.0
  # 记忆后端选择器。可以是注册的后端名（对应暴露 MANAGER_CLASS 的
  # backends/<name>/ 目录，例如 deermem / mem0 / noop），或指向
  # MemoryManager 子类的点分导入路径。
  manager_class: deermem
  # 记忆操作模式：
  #   middleware（默认）- 每轮结束后被动后台提取。
  #   tool - 实验性可选项；模型直接调用 memory_search/memory_add/
  #     memory_update/memory_delete。这让模型对记忆写入有主动权，但效果
  #     取决于模型的工具使用行为。
  # 正常情况下同一时刻只有一种模式在运行。需要会话级提取的后端可以在
  # tool 模式下保留被动写入，同时仍提供查询感知的检索（mem0 就是如此）。
  # 工具调用经由激活的 MemoryManager；不支持的事实 CRUD 返回 JSON 错误。
  mode: middleware
  # 后端私有配置（一个 dict），原样传给后端 __init__。
  # 各后端自行解释（DeerMem 将其解析为 DeerMemConfig）。
  #
  # OpenViking 示例（manager_class 为 openviking 时替换这段 DeerMem
  # backend_config 块）。首个官方适配器集成：一把绑定凭据的 OpenViking
  # USER key 对应一个 DeerFlow 用户，且仅支持 middleware 模式。
  # DeerFlow 关闭认证时使用 owner_user_id: default。
  #
  # backend_config:
  #   base_url: http://openviking:1933
  #   owner_user_id: default
  #   api_key_env: OPENVIKING_API_KEY
  #   timeout_seconds: 30
  #   default_peer_id: deerflow
  #   max_seen_message_ids: 512 # 有界的仅哈希捕获游标
  #   startup_policy: fail_fast
  #   failure_policy:
  #     read: fail_open
  #     write: log_and_drop
  #   retrieval:
  #     top_k: 8
  #     score_threshold: 0.25
  #     max_injection_chars: 12000
  #     content_mode: overview
  #     injection_query: >-
  #       用户画像、偏好、重要实体、事件、进行中的目标、
  #       约束与既往决策
  #
  # Docker 版 DeerFlow 使用宿主机安装的 OpenViking 时，请把 base_url 设为
  # http://host.docker.internal:1933 并设 allow_insecure_http: true。
  # 附带的可选 Compose 覆盖使用内部地址 http://openviking:1933。
  #
  # Honcho 示例（manager_class 为 honcho 时替换这段 DeerMem backend_config
  # 块）。该远程 HTTP 适配器使用 Honcho 服务端 deriver 构建用户模型记忆
  # 表示；本地不做 LLM 调用。
  #
  # backend_config:
  #   base_url: http://localhost:8000
  #   # api_key: $HONCHO_API_KEY   # 托管版 Honcho；明文 http + api_key 需设 allow_insecure_http: true
  #   workspace_prefix: deerflow-u-   # 每个用户 ID 一个隔离工作区
  #   # workspace_overrides: {}    # 把特定用户 ID 映射到自定义工作区
  #   # user_peer_overrides: {}    # 把特定用户 ID 映射到自定义 peer 名称
  #   assistant_peer: deerflow
  backend_config:
    storage_path: ""            # 空 = deer-flow base_dir（工厂注入绝对 runtime_home）；非空路径即根目录（每个用户的记忆在 {storage_path}/users/{uid}/memory.json）
    storage_class: file         # file（默认）或点分 MemoryStorage 类路径；非法的持久化后端会快速失败
    strict_user_scope: false    # 已认证部署在所有调用方都传递 user_id 后设为 true
    manifest_filename: memory.json # 用户全局 JSON：仅版本/修订/时间 + user/history；不含事实与事实索引
    file_lock_timeout_seconds: 10 # 单机本地文件系统的每作用域跨进程咨询锁超时
    retrieval_adapter: fts5     # fts5（默认）、空值关闭，或点分 RetrievalPort factory(config)
    debounce_seconds: 30 # 处理排队更新前的等待时间
    # 待处理条目的背压上限。0 = 无限制。触顶时新的非信号更新被拒绝
    # （QueueFull）；信号更新始终放行，重要记忆因此不会被丢弃。
    queue_max_depth: 1000
    model:                      # 用于记忆提取的 LLM；全部省略 = 不做提取（非 LLM 操作仍可用；更新会抛错）
      # provider: openai
      # model: gpt-4o-mini
      # api_key: $OPENAI_API_KEY
      # base_url:               # 可选，OpenAI 兼容网关（如 DeepSeek）使用
      # temperature:            # 可选
    max_facts: 100 # 最大存储事实数
    fact_confidence_threshold: 0.7 # 存储事实的最低置信度
    # 容量淘汰默认沿用历史上的仅置信度排名。
    # 可选启用 hybrid-v1：综合置信度（65%）、显式确认新鲜度（25%，
    # 90 天半衰期）与查询驱动的访问热度（10%，30 天半衰期）打分。
    # 实际的 memory_search 命中才计数；默认注入不计。有界的 10% 修正
    # 储备让存储与保证注入的修正对齐。确认检测是批次级的：检查最近六条
    # 过滤后消息中的人工消息，由 LLM 把该信号绑定到 factsToReinforce 的
    # ID，不再做第二次对应校验。影子模式审计 hybrid 与仅置信度两种
    # 排名的分歧，不改变实际保留哪些事实。
    fact_eviction_policy: confidence # confidence | hybrid-v1
    fact_eviction_shadow_enabled: false
    eviction_confidence_weight: 0.65
    eviction_confirmation_weight: 0.25
    eviction_access_weight: 0.10
    eviction_confirmation_half_life_days: 90
    eviction_access_half_life_days: 30
    eviction_correction_reserved_fraction: 0.10
    eviction_correction_reserved_max: 10
    eviction_audit_max_entries: 200 # 每个用户/智能体作用域仅元数据的事件；0 关闭
    max_injection_tokens: 2000 # 记忆注入的最大 token 数
    # 记忆注入预算的 token 计数策略：
    #   tiktoken（默认）- 精确，但编码 BPE 数据在首次使用时可能需要从
    #     公网端点下载。网络受限环境下该下载可能长时间阻塞
    #     （见 issues #3402 / #3429）。请预缓存编码或设为 "char" 规避。
    #   char - 免网络、感知 CJK 的按字符估算；完全不碰 tiktoken。
    #     预算精度略低，零网络 IO。
    token_counting: tiktoken
    # 保证注入：绕过常规 token 预算、从保留额度支取的事实类别，让高信号
    # 修正（如"别用 pip，用 uv"）即使在预算紧张时也能留存。
    guaranteed_categories:
      - correction
    guaranteed_token_budget: 500
    # 过期审查：周期性修剪可能已不再反映用户现状的过期事实。触发时，
    # LLM 在常规记忆更新调用中（同一次 LLM 调用，无额外 API 开销）审查
    # 超过各自审查窗口（expected_valid_days，回退 staleness_age_days）的
    # 事实，并逐条决定 KEEP、REMOVE 或 EXTEND。LLM 在创建事实时赋
    # expected_valid_days；EXTEND（staleFactsToExtend）在审查时重新校准
    # 该窗口。
    staleness_review_enabled: true
    staleness_age_days: 90
    staleness_min_candidates: 3
    staleness_max_removals_per_cycle: 10
    staleness_protected_categories:
      - correction
    staleness_max_lifetime_multiplier: 20.0   # 创建上限 = staleness_age_days x 倍数（90 x 20 = 1800 天）
    staleness_max_extension_days: 3650        # 延长后 expected_valid_days 的绝对上限（约 10 年）
    # 记忆整合（可选，有损：源事实被合成事实替换；仅保留 consolidatedFrom
    # ID）。与提取/过期审查同一次记忆更新 LLM 调用内运行——无额外 API
    # 成本。consolidation_enabled 默认 false，因为整合是有损的。
    consolidation_enabled: false       # 设为 true 启用事实整合
    consolidation_min_facts: 8         # 单类别触发审查的最少事实数（3-30）
    consolidation_max_groups_per_cycle: 3  # 每个更新周期合并的最大组数（1-10）
    consolidation_max_sources: 8       # 每个整合组的最大源事实数（2-20）
    # extraction_callback 是宿主注入的提取后可观测性钩子
    # （token 用量、事实接受/拒绝、拒绝率）。工厂注入日志默认实现；
    # 编程方式设置可发出 Langfuse span。
    # 消息处理（外置模式 / 提示词模板）：
    #   patterns_dir        - 放置 correction.yaml / reinforcement.yaml 的目录，
    #                         覆盖内置的信号检测模式。None（默认）=
    #                         内置 core/message_patterns/。显式设置时两个
    #                         文件必须都存在（拼写错误或缺失挂载会报错）。
    #   prompts_dir         - 放置自定义记忆提取提示词模板的目录
    #                         （memory_update.chat.yaml、staleness_review.yaml、
    #                         consolidation.yaml、fact_extraction.yaml）。None（默认）
    #                         = 内置 core/prompts/。支持按智能体的子目录。
    # patterns_dir: ""            # 空 = 内置默认值
    # prompts_dir: ""             # 空 = 内置默认值

# ============================================================================
# 自定义智能体管理 API
# ============================================================================
# 控制 HTTP Gateway 是否暴露自定义智能体 SOUL/USER.md 管理。
# 除非 Gateway 位于可信的认证管理边界之后，否则保持关闭。
agents_api:
  enabled: false

# ============================================================================
# 技能自我进化配置
# ============================================================================
# 允许智能体在 skills/custom/ 下自主创建与改进技能。
skill_evolution:
  enabled: false # 设为 true 允许智能体自管写入 skills/custom
  moderation_model_name: null # 用于 LLM 安全扫描的模型（null = 使用默认模型）
  security_fail_closed: true # 审核模型不可用时：true 拦截所有写入；false 允许非可执行内容并告警（可执行内容始终拦截）

# ============================================================================
# 检查点配置（已废弃——请改用 `database`）
# ============================================================================
# 旧版独立 checkpointer 配置。仅为向后兼容保留。
# 建议使用下方统一的 `database` 节：它用单一后端设置同时驱动
# LangGraph checkpointer、LangGraph Store 和 DeerFlow 应用数据
# （运行、反馈、事件）。
#
# 如果 `checkpointer` 与 `database` 同时存在，仅 LangGraph checkpointer
# 与 Store 优先使用 `checkpointer`。
#
# checkpointer:
#   type: sqlite
#   connection_string: checkpoints.db
#
# checkpointer:
#   type: postgres
#   connection_string: postgresql://user:password@localhost:5432/deerflow
#   # 可选：把 LangGraph checkpointer/store 表放进该 schema。
#   # 留空则使用服务端默认 search_path（通常是 public）。
#   postgres_schema: deerflow

# ============================================================================
# 数据库
# ============================================================================
# LangGraph checkpointer、LangGraph Store 与 DeerFlow 应用数据
# （运行、线程元数据、反馈等）的统一存储后端。
#
# backend: memory  -- 不持久化，重启后数据丢失
# backend: sqlite  -- 单节点部署，文件存放在 sqlite_dir
# backend: postgres -- 生产多节点部署
#
# config.yaml 中省略或留空本节时，DeerFlow 使用：
#   backend: sqlite
#   sqlite_dir: .deer-flow/data
#
# SQLite 模式用单个 deerflow.db 文件（WAL 日志模式）同时承载
# checkpointer、Store 与应用数据。
#
# Postgres 模式：把连接 URL 放进 .env 的 DATABASE_URL，
# 然后在这里用 $DATABASE_URL 引用。
#
# 安装驱动——issue #2754 的修复让每个代码路径都带上 `UV_EXTRAS`：
#   本地      `make dev` 会自动探测下方的 `database.backend: postgres`，
#             并在每次重启时向 `uv sync` 传 `--extra postgres`，因此
#              该 extra 不会再被清掉。要显式选择（或叠加 `postgres,ollama`
#              等多个 extra），在项目根目录 .env 中设置：
#                  UV_EXTRAS=postgres
#   Docker dev `make docker-start` 经 `env_file` 从项目根 .env 读取
#              `UV_EXTRAS`。设置：
#                  UV_EXTRAS=postgres
#              同样支持多个 extra（`postgres,ollama`）——见
#              docker/dev-entrypoint.sh。
#   Docker 镜像 build-arg `UV_EXTRAS=postgres,discord docker compose build`
#              构建时支持逗号或空格分隔的多个 extra
#              （backend/Dockerfile 会展开为多个 `--extra` 参数）。
#
# 首次引导（`make dev` 之前）：
#   cd backend && uv sync --all-packages --extra postgres
#   （--all-packages 会把 extra 传播到 workspace 成员——见 PR #2584）
#
# 注意：`checkpointer` 与 `database` 同时配置时，LangGraph checkpointer
# 与 Store 优先使用 `checkpointer`；DeerFlow 应用数据仍由 `database`
# 控制。使用 `database` 时可以移除 `checkpointer` 节。
# database:
#   backend: sqlite
#   sqlite_dir: .deer-flow/data
#
# database:
#   backend: postgres
#   postgres_url: $DATABASE_URL
#   # 可选：把 DeerFlow ORM 表和 LangGraph checkpointer/store 表放进该
#   # schema。留空则使用服务端默认 search_path（通常是 public）。
#   postgres_schema: deerflow
#
# postgres_schema 仅对新表生效。启动时 DeerFlow 执行
# CREATE SCHEMA IF NOT EXISTS 并固定连接的 search_path；它从不移动已有
# 表，因此 `public` 中的第三方表不受影响。
#
# 把既有部署从 `public` 迁到专用 schema：
#   1. 停止 DeerFlow 服务。
#   2. 把每一张 DeerFlow 所属的表连同 Alembic 状态一起移入新 schema
#      （以数据库属主身份执行）。漏掉任何一张表都会让它的行滞留：重启后
#      DeerFlow 会在目标 schema 重建对应的空表，旧行在 `public` 中继续
#      不可见。移动 ORM 表却落下 `alembic_version` 尤其危险——bootstrap
#      会把目标 schema 当作未版本化处理，重新基线并重放迁移。
#        CREATE SCHEMA IF NOT EXISTS deerflow;
#        -- 应用 ORM 表：
#        ALTER TABLE public.runs                  SET SCHEMA deerflow;
#        ALTER TABLE public.run_events            SET SCHEMA deerflow;
#        ALTER TABLE public.threads_meta          SET SCHEMA deerflow;
#        ALTER TABLE public.feedback              SET SCHEMA deerflow;
#        ALTER TABLE public.users                 SET SCHEMA deerflow;
#        ALTER TABLE public.agents                SET SCHEMA deerflow;
#        -- IM 渠道表：
#        ALTER TABLE public.channel_connections   SET SCHEMA deerflow;
#        ALTER TABLE public.channel_credentials   SET SCHEMA deerflow;
#        ALTER TABLE public.channel_oauth_states  SET SCHEMA deerflow;
#        ALTER TABLE public.channel_conversations SET SCHEMA deerflow;
#        -- 定时任务表：
#        ALTER TABLE public.scheduled_tasks       SET SCHEMA deerflow;
#        ALTER TABLE public.scheduled_task_runs   SET SCHEMA deerflow;
#        -- Alembic 迁移状态（必须——见上方说明）：
#        ALTER TABLE public.alembic_version       SET SCHEMA deerflow;
#      DeerFlow 所属的表集合会随时间增长；以 DeerFlow 数据库属主身份
#      用下面的查询发现上表未覆盖的表：
#        SELECT table_name FROM information_schema.tables WHERE table_schema='public';
#      LangGraph checkpointer/store 的表名也随版本变化——用同样方式列出，
#      然后对每一张执行 ALTER ... SET SCHEMA deerflow（例如 checkpoints、
#      checkpoint_blobs、checkpoint_writes、checkpoint_migrations、store、
#      store_migrations）。
#   3. 在这里设置 postgres_schema: deerflow 并重启。
#   4. 用 `SHOW search_path;` 和冒烟测试验证（创建一次运行并读取其
#      历史）。`public` schema 不应再出现新的 DeerFlow 表。
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data

# ============================================================================
# 入站 webhook 去重存储（跨 Pod 重投递去重——issue #4120）
# ============================================================================
# ChannelManager 记录入站 webhook 去重状态的位置。
#
# backend: auto     -- （默认）database.backend=postgres 时用 Postgres，
#                       包括多副本 K8s（每个 Pod 单 worker 但共享一个库）。
#                       否则使用进程内内存存储（单库单 Pod）。
#                       注意：多副本部署必须使用 Postgres；如果
#                       database.backend 是 sqlite/memory，'auto' 回退到
#                       每 Pod 内存存储，跨 Pod 去重被禁用。
# backend: memory   -- 仅进程内存储。每 Pod 独立：同一 webhook 重投递到
#                       另一个副本时不会被去重。多 worker 部署不推荐
#                       （启动时记录 WARNING）。
# backend: postgres -- 通过应用数据库在 Pod 间共享去重状态。
#                       任何多副本部署都必须用它。若 database.backend
#                       不是 'postgres'，会记录 WARNING 并回退到进程内
#                       内存存储。
#
# dedupe_storage:
#   backend: auto

  # 在环境的空闲回收阈值之前回收应用 ORM 的 PostgreSQL 连接。
  pool_recycle: 300
  # 应用 ORM 的 PostgreSQL 命令超时。设为 null 关闭，或为刻意长时间
  # 运行的命令调高。
  command_timeout: 30
  # 需重启。共享该数据库的所有进程必须使用同一个值。
  # full：现行完整消息检查点；delta：消息使用 DeltaChannel。
  checkpoint_channel_mode: full
  # Delta 模式调优（仅 checkpoint_channel_mode 为 delta 时生效）。
  # 与模式本身一样需要重启：节奏被编译进每个图的通道表。共享此数据库
  # 的所有进程必须一致。
  # snapshot_frequency：每 N 次步进写入做一次完整消息快照
  # （越大检查点越小，物化越慢）。
  checkpoint_delta:
    snapshot_frequency: 10
  # 编译后检查点图缓存的容量上限（每进程）。
  # 支持热更新、无需重启：每次逐出检查时重新读取，只在缓存发生逐出时
  # 生效，从不影响图语义。
  checkpoint_graph_cache:
    # Gateway 线程状态访问器图（按 assistant/模式/节奏）。
    accessor_graph_max: 64
  # Delta 模式检查点历史缓存（仅 checkpoint_channel_mode: delta 时使用）。
  # 纯性能策略：跨 worker 不一致是安全的，永不冻结。
  # checkpoint_cache:
  #   type: memory            # memory | redis（redis 仅限 Gateway/异步）
  #   max_entries: 128        # 0 关闭缓存
  #   redis_url: null         # 或 DEER_FLOW_CHECKPOINT_CACHE_REDIS_URL / REDIS_URL
  #   ttl_seconds: 86400      # redis 防泄漏兜底；线程删除清理失败时约束
  #                           # 残留副本（清理本身是即时的）。
  #                           # 0 显式禁用过期（仅受 redis maxmemory 限制）
  #   key_prefix: ""          # 默认：数据库身份的哈希

# ============================================================================
# 运行事件配置
# ============================================================================
# 运行事件（消息 + 执行轨迹）的存储后端。
#
# backend: memory  -- 不持久化，重启后数据丢失（默认）
# backend: db      -- 经 ORM 的 SQL 数据库，完整查询能力（生产）
# backend: jsonl   -- 追加式 JSONL 文件（轻量单节点持久化）
#
# run_events:
#   backend: memory
#   max_trace_content: 10240    # 轨迹内容截断阈值（db 后端，字节）
#   track_token_usage: true     # 把 token 计数累加到 RunRow
run_events:
  backend: memory
  max_trace_content: 10240
  track_token_usage: true

# ============================================================================
# 智能体存储配置
# ============================================================================
# 自定义智能体定义（config.yaml + SOUL.md）与部署级托管子智能体定义
# 的存放位置。它与 `database`（运行/线程/事件数据）以及智能体记忆相互
# 独立。需要重启（后端在 Gateway lifespan 启动时确定）。
#
# backend: file  -- 自定义智能体按用户存文件；托管子智能体在
#                   {base_dir}/managed-subagents/ 下各存一个 JSON 文件
#                   （默认）。无共享挂载时为节点本地。
# backend: db    -- 两类定义都使用共享 SQL 持久层，所有节点可见。
#                   要求 database.backend 为 'sqlite' 或 'postgres'
#                   （'memory' 在启动时被拒绝）。
#
# 已有安装要切换到 'db'？先用下面的命令导入磁盘上的自定义智能体与
# 托管子智能体：
#     python backend/scripts/migrate_agents_to_db.py   # --dry-run 预览
# 源文件保持原位，因此回退到 'file' 是干净的回滚。
#
# agent_storage:
#   backend: file
agent_storage:
  backend: file

# ============================================================================
# 定时任务配置
# ============================================================================
# 面向一次性、cron 与间隔型智能体运行的后台调度器。
# 轮询器字段（enabled、multi_instance、poll_interval_seconds、
# lease_seconds、max_concurrent_runs、min_once_delay_seconds）需重启生效。
# recursion_limit 在派发时读取，下一次定时运行即生效，无需重启
# Gateway。默认（1000）与 Web 界面的交互预算一致，定时运行与交互运行
# 开箱即保持相同行为。超过 max_recursion_limit 的取值会被钳制。
#
# 调度器默认单实例。仅当每个 Gateway 实例都共享 Postgres、运行归属
# 心跳和数据库化的运行事件时才设 multi_instance: true；此时启动恢复
# 会保留对端实例的活跃运行。
#
# scheduler:
#   enabled: false               # 后台轮询器总开关
#   multi_instance: false        # 选择跨 Gateway 实例的租约感知恢复
#   poll_interval_seconds: 5     # 扫描到期任务的频率
#   lease_seconds: 120           # 认领租约；崩溃进程的任务在此之后可被回收
#   max_concurrent_runs: 3       # 多实例 Pod 间 launching/running 定时运行的全局上限
#   queue_timeout_seconds: 3600  # 单次运行在持久队列中的最长等待，超时失败
#   min_once_delay_seconds: 60   # 一次性 run_at 偏移与间隔 every_seconds 的下限
#   recursion_limit: 1000        # 定时运行的 LangGraph 超级步上限（与 Web 界面一致）
scheduler:
  enabled: false
  multi_instance: false       # 选择跨 Gateway 实例的租约感知恢复
  poll_interval_seconds: 5
  lease_seconds: 120
  max_concurrent_runs: 3
  queue_timeout_seconds: 3600
  min_once_delay_seconds: 60
  recursion_limit: 1000

# ============================================================================
# 长时 MCP 任务配置
# ============================================================================
# 普通 MCP submit/status/cancel 任务工具集的持久运行时。默认关闭；
# task_toolsets 在 extensions_config.json 中按服务器配置。
# 所有字段需重启生效（在 Gateway lifespan 启动时捕获）。
#
# mcp_tasks:
#   enabled: false               # 后台状态轮询器总开关
#   poll_interval_seconds: 5     # 扫描间隔，也是默认任务重试间隔
#   lease_seconds: 120           # 过期认领在此延迟后可被回收
#   max_concurrent_polls: 8      # 单个 worker 每轮扫描发起的状态查询上限
#   max_poll_backoff_seconds: 300             # 瞬时错误后指数重试的上限
#   input_required_poll_interval_seconds: 60  # 等待用户输入期间的最小轮询间隔
#   tracking_degraded_after_errors: 3         # 查询 API 报告追踪降级前的连续错误数
#   max_result_bytes: 65536                    # 完整 JSON 结果的存储上限
#   result_preview_max_chars: 2000             # 结果超限时保留的文本预览长度
mcp_tasks:
  enabled: false
  poll_interval_seconds: 5
  lease_seconds: 120
  max_concurrent_polls: 8
  max_poll_backoff_seconds: 300
  input_required_poll_interval_seconds: 60
  tracking_degraded_after_errors: 3
  max_result_bytes: 65536
  result_preview_max_chars: 2000

# ============================================================================
# 运行归属配置
# ============================================================================
# 控制多 worker 部署下的跨进程运行归属。
# GATEWAY_WORKERS > 1 时，每个 worker 用租约认领运行；心跳续租，
# 收敛负责从崩溃 worker 手中恢复孤儿运行。
#
# 时钟同步要求（仅多 worker）：收敛会把另一个 worker 的 UTC 租约时间戳
# 与本 worker 的 datetime.now(UTC) 比较。各 worker 的时钟必须在几秒内
# 同步（NTP / chrony / systemd-timesyncd——K8s 与云 VM 默认开启）。
# grace_seconds 就是允许的时钟偏差预算；最坏情况（归属 worker 的心跳
# 恰好快到点），时钟快过 grace_seconds 的对端可能把仍活跃的运行误判为
# 孤儿并回收。环境无法保证几秒内时钟同步时请调高 grace_seconds；
# 代价是真死 worker 的恢复延迟变长（自最后一次心跳起 lease_seconds +
# grace_seconds 才回收）。
#
# 归属 worker 自身不会把 grace_seconds 当额外执行时间。若在
# lease_seconds 到期前无法确认续租成功，它会取消本地运行并抑制持久化
# 终态；grace_seconds 只影响对端何时可以回收过期行。

run_ownership:
  lease_seconds: 30           # 运行租约未续期多少秒后过期。
                              # 心跳每 lease_seconds / 3 续一次。
  grace_seconds: 10           # 租约过期后再等多少秒才回收孤儿运行。
                              # 也是跨 worker 时钟偏差预算——见上方说明。
  heartbeat_enabled: false    # GATEWAY_WORKERS > 1 时设为 true

# ============================================================================
# 流桥接配置
# ============================================================================
# 流桥接把 Gateway worker 的实时智能体事件送达 SSE 客户端。Docker
# Compose 会自动设置 DEER_FLOW_STREAM_BRIDGE_REDIS_URL，因此 Docker
# 部署即使省略本节也会使用 Redis Streams。
#
# redis 桥接需要可选的 `redis` extra。`make dev` 会根据本节自动探测
# 安装；Docker 镜像中始终已安装。手动安装：
# cd backend && uv sync --all-packages --extra redis
#
# stream_bridge:
#   type: memory                 # 仅单进程
#   queue_maxsize: 256           # 每次运行保留的数据事件数（最小：1）。
#                                # 早于该窗口的重连会收到 SSE `gap`。
#   heartbeat_interval_seconds: 15  # 发送给 SSE、wait 与内部流消费者的
#                                   # 心跳之间的空闲间隔（上限：86400）。
#
# stream_bridge:
#   type: redis                  # Docker / 多 worker Gateway 推荐
#   redis_url: redis://redis:6379/0
#   queue_maxsize: 256           # 每次运行保留的数据事件数（Redis MAXLEN，最小：1）。
#                                # 更早的有效游标会收到 SSE `gap`。
#   heartbeat_interval_seconds: 15  # 发送给 SSE、wait 与内部流消费者的
#                                   # 心跳之间的空闲间隔（上限：86400）。
#   stream_ttl_seconds: 86400    # 保留流缓冲的滚动 TTL。
#                                # 每次 publish/publish_end 刷新；设 0
#                                # 关闭。这不是运行超时。
#   recovered_stream_cleanup_delay_seconds: 60  # 恢复的孤儿运行发布 END 后，
#                                # 删除流键前等待的秒数。
#   max_connections: 100         # 可选的连接池上限。每个活跃 SSE 客户端
#                                # 都持有一条阻塞在 XREAD ... BLOCK 的连接，
#                                # 最长可达配置的心跳间隔，因此数百个并发
#                                # 客户端会打开数百条连接。不设 = redis-py
#                                # 默认（无上限）。
#
# 注意：redis 桥接在 v1 是 fail-hard 的。Redis.from_url 是惰性的，Redis
# 宕机不会阻塞 Gateway 启动，但首次 publish/xread 会抛错。运行中途的
# Redis 故障会使活跃运行失败——没有自动重试/退避，也不会回退到内存
# 桥接。请以 HA / 自动重启策略运行 Redis。

# ============================================================================
# 用户自有 IM 渠道连接
# ============================================================================
# 让已登录用户从 DeerFlow 前端连接自己的 IM 账号，同时复用下方现有的
# `channels` 运行时配置。
#
# 安全说明：
# - 不需要公网 IP、OAuth 回调地址或 Provider webhook。
# - Provider 机器人/应用凭据仍在 `channels.*` 下。
# - `channel_connections` 存储按用户绑定与一次性连接码。
# - Telegram 在配置 `bot_username` 时使用深链。
# - Slack、Discord、飞书、钉钉、微信、企业微信通过已在运行的机器人/
#   应用使用 `/connect <code>`。
#
# channel_connections:
#   enabled: false
#   # 安全：除非刻意想要旧式开放机器人行为，否则保持启用。
#   # 关闭它会让未绑定的外部 IM 用户创建 DeerFlow 线程/运行。
#   require_bound_identity: true
#
#   telegram:
#     enabled: false
#     bot_username: $TELEGRAM_BOT_USERNAME
#
#   slack:
#     enabled: false
#
#   discord:
#     enabled: false
#
#   feishu:
#     enabled: false
#
#   dingtalk:
#     enabled: false
#
#   wechat:
#     enabled: false
#
#   wecom:
#     enabled: false
#
#   buzz:
#     enabled: false

