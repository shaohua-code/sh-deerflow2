  #   # api_key: $FIRECRAWL_API_KEY
  #   # base_url: http://<host>:3002  # 可选：自托管 Firecrawl；无需云 API Key

  # 网页抓取工具（使用 GroundRoute，需要 GROUNDROUTE_API_KEY）
  # 通过 GroundRoute 的 mode=page 抓取页面提取后的正文。
  # 注意：同一时间只能启用一个 web_fetch Provider。
  # 启用本条前，先注释掉上方的 Jina AI web_fetch 条目。
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.groundroute.tools:web_fetch_tool
  #   # api_key: $GROUNDROUTE_API_KEY

  # 网页抓取工具（使用 fastCRW——Firecrawl 兼容的网页抓取器，单二进制，
  # 可自托管或用云版。云版需要 CRW_API_KEY；自托管可能无需密钥。）
  # 注意：同一时间只能启用一个 web_fetch Provider。
  # 启用本条前，先注释掉上方的 Jina AI web_fetch 条目。
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.fastcrw.tools:web_fetch_tool
  #   # api_key: $CRW_API_KEY
  #   # base_url: https://fastcrw.com/api   # 默认云版；自托管改成如 http://localhost:3000
  #   # allow_private_addresses: false      # SSRF 防护：生产环境保持 false。仅针对有意的内网目标才设 true。

  # 网页抓取工具（使用 Sofya，需要 SOFYA_API_KEY）
  # 以 markdown 返回页面内容。也支持 PDF、DOCX 等文档。
  # 注意：同一时间只能启用一个 web_fetch Provider。
  # 启用本条前，先注释掉上方的 Jina AI web_fetch 条目。
  # - name: web_fetch
