# ============================================================================
# 工具组配置
# ============================================================================
# 定义工具分组，用于组织与访问控制

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash
  - name: browser
  - name: knowledge

# ============================================================================
# 工具配置
# ============================================================================
# 为智能体配置可用工具

tools:
  # 读取被显式引用的会话（仅 Gateway API，需显式开启）。
  # 每次运行必须提交 conversation_references；见 backend/docs/API.md。
  # - name: read_conversation
  #   group: conversation
  #   use: deerflow.tools.conversation:read_conversation

  # RAGFlow 知识检索（只读）。取消这一条注释即可启用。
  # `datasets` 可选。省略它会在检索时列出该租户可见的全部数据集；
  # 显式 `datasets: []` 是非法值。空数据集会被跳过；可检索的数据集按
  # 嵌入模型分组，最多四组并行检索。各组的排名在全局 `page_size` 限制
  # 下交错返回；多组检索时不返回分数，因为不同组之间分数不可比。
  # 只配置稳定的 ID 来限定范围。ID 和数据集目录永远不会传给模型。
  # - name: knowledge_search
  #   group: knowledge
  #   use: deerflow.community.ragflow.tools:knowledge_search_tool
  #   base_url: http://localhost:9380  # Docker 部署：使用后端可达的地址
  #   api_key: $RAGFLOW_API_KEY
  #   datasets:  # 可选的运维侧白名单
  #     - 0123456789abcdef0123456789abcdef  # 替换为 RAGFlow 数据集 ID
  #   timeout: 30
  #   page_size: 8
  #   similarity_threshold: 0.2
  #   vector_similarity_weight: 0.3
  #   top_k: 256
  #   max_chars_per_chunk: 800
  #   max_total_chars: 8000

  # LightRAG 知识检索（只读）。同一个 knowledge_search 工具的替代
  # Provider；取消这条注释替代 RAGFlow 那条——重名条目只保留第一条，
  # 所以必须恰好配置一个。要求 LightRAG v1.4.9+（响应封装和引用字段）。
  # 通过数据检索端点检索本部署唯一的已索引工作区（LightRAG 内部不做
  # LLM 生成）。`api_key` 可选；仅回环/可信内网服务可省略——启用鉴权时
  # 密钥以 X-API-Key 请求头发送。`mode` 选择检索策略：naive、local、
  # global、hybrid 或 mix（默认 mix，与 LightRAG 自身默认一致）。
  # 内部分块与引用标识永远不会传给模型。
  # - name: knowledge_search
  #   group: knowledge
  #   use: deerflow.community.lightrag.tools:knowledge_search_tool
  #   base_url: http://localhost:9621  # Docker 部署：使用后端可达的地址
  #   api_key: $LIGHTRAG_API_KEY  # 仅无鉴权的可信服务可省略
  #   mode: mix
  #   timeout: 30
  #   top_k: 60
  #   chunk_top_k: 8  # 可选；省略则使用服务端默认值
  #   max_chars_per_chunk: 800
  #   max_total_chars: 8000

  # 网页搜索工具（使用 DuckDuckGo，无需 API Key）
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5
    # backend: auto          # DDGS 后端：auto、duckduckgo、brave、wikipedia 等
    # region: wt-wt          # backend 含 auto/all/wikipedia 时，wt-wt 会为 Wikipedia 归一化。
    # safesearch: moderate   # on、moderate、off

  # 网页搜索工具（使用 SearXNG，自托管，无需 API Key）
  # SearXNG 是免费的互联网元搜索引擎，聚合多个搜索服务的结果。
  # 部署你自己的实例：https://github.com/searxng/searxng
  # Docker 部署时请用 Docker 服务名代替 localhost。
  # - name: web_search
  #   group: web
  #   use: deerflow.community.searxng.tools:web_search_tool
  #   base_url: http://localhost:8088   # SearXNG 实例地址（默认 :8088；Docker：http://searxng:8080）
  #   max_results: 5                     # 最大搜索结果数

  # 网页搜索工具（使用 Serper——Google 搜索 API，需要 SERPER_API_KEY）
  # Serper 提供实时 Google 搜索结果。在 https://serper.dev 注册。
  # 注意：启动应用前先在环境中设置 SERPER_API_KEY。
  # 不要把明文 API Key 写进 config.yaml；请使用 $VAR 形式。
  # - name: web_search
  #   group: web
  #   use: deerflow.community.serper.tools:web_search_tool
  #   max_results: 5   # Serper Provider 上限 10
  #   # api_key: $SERPER_API_KEY  # 可选的显式环境变量引用

  # 网页搜索工具（使用 Serply——Google 搜索 API，需要 SERPLY_API_KEY）
  # Serply 返回实时 Google 结果，同一把密钥还覆盖 Google News 和
  # Google Scholar。在 https://serply.io 注册（文档：https://serply.io/docs）
  # - name: web_search
  #   group: web
  #   use: deerflow.community.serply.tools:web_search_tool
  #   max_results: 5                 # Serply 每次请求接受 1-100
  #   # vertical: search             # search（默认）、news 或 scholar
  #   # gl: us                       # 可选的结果国家代码
  #   # hl: en                       # 可选的界面语言
  #   # api_key: $SERPLY_API_KEY     # 环境变量已设置时可省略

  # 网页搜索工具（使用 Brave Search API，需要 BRAVE_SEARCH_API_KEY）
  # Brave Search 返回独立索引的结果。在
  # https://brave.com/search/api/ 注册获取密钥。与上面 DuckDuckGo 的
  # `backend: brave` 选项不同，这里直接调用 Brave 官方 API。
  # - name: web_search
  #   group: web
  #   use: deerflow.community.brave.tools:web_search_tool
  #   max_results: 5                  # Brave Search API 上限 20
  #   # api_key: $BRAVE_SEARCH_API_KEY  # 环境变量已设置时可省略

  # 网页搜索工具（需要 Tavily API key）
  # - name: web_search
  #   group: web
  #   use: deerflow.community.tavily.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $TAVILY_API_KEY  # 按需设置

  # 网页搜索工具（使用 InfoQuest，需要 InfoQuest API key）
  # - name: web_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_search_tool
  #   # 用于限定搜索结果范围，只返回指定时间范围内的内容。设为 -1 关闭时间过滤
  #   search_time_range: 10

  # 网页搜索工具（使用腾讯云 Web Search API，需要服务 API 密钥）
  # 在腾讯云 WSA 控制台创建服务 API 密钥，然后在 Gateway 环境中设置
  # TENCENTCLOUD_WSA_APIKEY。该 Provider 不要使用腾讯云
  # SecretId/SecretKey。
  # - name: web_search
  #   group: web
  #   use: deerflow.community.tencent_wsa.tools:web_search_tool
  #   max_results: 5                 # 1-50；大于 10 的取值会请求腾讯的 Cnt 选项
  #                                    # （需要支持 Cnt 的腾讯套餐）
  #   # mode: 0                      # 可选：0=网页、1=VR、2=混合
  #   # api_key: $TENCENTCLOUD_WSA_APIKEY  # 可选的显式环境变量引用

  # 网页搜索工具（使用 Exa，需要 EXA_API_KEY）
  # - name: web_search
  #   group: web
  #   use: deerflow.community.exa.tools:web_search_tool
  #   max_results: 5
  #   search_type: auto  # 可选值：auto、neural、keyword
  #   contents_max_characters: 1000
  #   # api_key: $EXA_API_KEY

  # 网页搜索工具（使用 Firecrawl。云版需要 FIRECRAWL_API_KEY；自托管可能无需密钥。）
  # - name: web_search
  #   group: web
  #   use: deerflow.community.firecrawl.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $FIRECRAWL_API_KEY
  #   # base_url: http://<host>:3002  # 可选：自托管 Firecrawl；无需云 API Key

  # 网页搜索工具（使用 GroundRoute，需要 GROUNDROUTE_API_KEY）
  # GroundRoute 是一个元搜索层：一个 API 聚合六个引擎（Serper、Brave、
  # Exa、Tavily、Firecrawl、Perplexity）。它把每个查询路由到满足质量
  # 门槛的最便宜引擎，并在引擎宕机时自动故障转移。计费为收益分成
  # （缓存节省约一半归你）。在 https://groundroute.ai/keys 获取密钥。
  # - name: web_search
  #   group: web
  #   use: deerflow.community.groundroute.tools:web_search_tool
  #   max_results: 5                  # GroundRoute 限制在 1-50
  #   # api_key: $GROUNDROUTE_API_KEY  # 环境变量已设置时可省略

  # 网页搜索工具（使用 fastCRW——Firecrawl 兼容的网页抓取器，单二进制，
  # 可自托管或用云版。云版需要 CRW_API_KEY；自托管可能无需密钥。）
  # - name: web_search
  #   group: web
  #   use: deerflow.community.fastcrw.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $CRW_API_KEY
  #   # base_url: https://fastcrw.com/api   # 默认云版；自托管改成如 http://localhost:3000

  # 网页搜索工具（使用 Sofya，需要 SOFYA_API_KEY）
  # Sofya 返回结果页面的正文内容，而不只是摘要。
  # 在 https://sofya.co 注册获取密钥。
  # 注意：启动应用前先在环境中设置 SOFYA_API_KEY。
  # 不要把明文 API Key 写进 config.yaml；请使用 $VAR 形式。
  # - name: web_search
  #   group: web
  #   use: deerflow.community.sofya.tools:web_search_tool
  #   max_results: 5                # Sofya Provider 上限 20
  #   # search_depth: basic         # basic 读取结果页面；snippets 只返回摘要
  #   contents_max_characters: 2000 # 单条结果内容上限；0 表示不限制
  #   # api_key: $SOFYA_API_KEY     # 可选的显式环境变量引用

  # 网页抓取工具（使用 Browserless——无头 Chrome，自托管或云版）
  # Browserless 用真实无头 Chrome 渲染页面，适合重 JavaScript 的网站和
  # SPA。自托管部署：https://github.com/browserless/browserless
  # Docker 部署时请用 Docker 服务名代替 localhost。
  # 注意：同一时间只能启用一个 web_fetch Provider。
  # 启用本条前，先注释掉下方的 Jina AI web_fetch 条目。
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.browserless.tools:web_fetch_tool
  #   base_url: http://localhost:3032    # Browserless 实例地址（默认 :3032；Docker：http://browserless:3000）
  #   # token: $BROWSERLESS_TOKEN        # API token（Browserless 云版必填；自托管可选）
  #   timeout_s: 30                       # 请求超时（秒）
  #   # allow_private_addresses: false    # SSRF 防护：生产环境保持 false。仅针对有意的内网目标才设 true。
  #   # wait_for_event: "networkidle"    # 返回前等待某个页面事件（如 "load"、"networkidle"）
  #   # wait_for_timeout_ms: 2000        # 页面加载完成后的额外等待（毫秒）
  #   # wait_for_selector: "article"     # 返回前等待匹配的 CSS 选择器

  # 网页抓取工具（使用 Crawl4AI——自托管无头 Chromium，无需第三方 API Key）
  # Crawl4AI 直接返回服务端清洗后的 "fit" markdown（无需可读性处理步骤），
  # 适合重 JavaScript 的网站。自托管部署：
  #   docker run -d -p 11235:11235 --shm-size=1g \
  #     -e CRAWL4AI_API_TOKEN=$CRAWL4AI_TOKEN unclecode/crawl4ai:0.9.2
  # Crawl4AI >= 0.9 默认安全：除 GET /health 外每个请求都必须携带 bearer
  # token，且未设置 CRAWL4AI_API_TOKEN 启动的服务只绑定 127.0.0.1
  # （容器内/远程的 DeerFlow 完全连不上）。请把服务端环境变量与下面的
  # `token:` 设成同一个值，否则请求返回 HTTP 401。
  # 请使用 >= 0.8.7：更早的镜像（包括 0.8.6）存在已知的前置鉴权 RCE。
  # Docker 部署时请用 Docker 服务名代替 localhost。
  # 注意：同一时间只能启用一个 web_fetch Provider。
  # 启用本条前，先注释掉下方的 Jina AI web_fetch 条目。
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.crawl4ai.tools:web_fetch_tool
  #   base_url: http://localhost:11235   # Crawl4AI 服务地址（Docker：http://crawl4ai:11235）
  #   token: $CRAWL4AI_TOKEN              # Bearer token；Crawl4AI >= 0.9 必填
  #   timeout: 30                         # 请求超时（秒）
  #   # allow_private_addresses: false     # SSRF 防护：生产环境保持 false。仅针对有意的内网目标才设 true。
  #   # filter: fit                       # Markdown 过滤器：fit（默认）| raw | bm25 | llm

  # 网页截图工具（使用 Browserless /screenshot 把页面渲染为产物）
  # Browserless 用真实无头 Chrome 截取重 JavaScript 的页面，并把截图写入
  # 当前线程的 outputs。可以连自托管的 Browserless 实例（无需 token），
  # 也可以连 Browserless 云版（需 BROWSERLESS_TOKEN）。
  # Docker 部署时请用 Docker 服务名代替 localhost。
  # - name: web_capture
  #   group: web
  #   use: deerflow.community.browserless.tools:web_capture_tool
  #   base_url: http://localhost:3032       # Browserless 实例地址（Docker：http://browserless:3000）
  #   # token: $BROWSERLESS_TOKEN           # 云版必填；自托管可选
  #   timeout_s: 30                         # 请求超时（秒）（也接受 `timeout`）
  #   output_format: png                    # png、jpeg 或 webp
  #   full_page: true                       # 截取整页而非仅视口
  #   viewport_width: 1280
  #   viewport_height: 720
  #   # wait_for_selector: "main"           # 截取前等待匹配的 CSS 选择器
  #   # wait_for_selector_timeout_ms: 5000
  #   # wait_for_timeout_ms: 1000           # 导航完成后的额外等待（毫秒）
  #   # best_attempt: true                  # 等待超时时按当前页面状态继续
  #   # allow_private_addresses: false      # SSRF 防护：生产环境保持 false。仅当确实要
  #   #                                     # 截取内网/私有目标（回环、RFC1918 等）时设 true

  # 智能体式浏览器控制（有状态的 导航 → 观察 → 点击/输入 循环）。
  # 与 web_fetch/web_capture（只读、无状态）不同，这些工具为每个线程
  # 保持一个活跃的 Playwright 浏览器，让智能体可以操作重 JavaScript 的
  # 页面、填写表单并执行多步流程。元素通过每次页面快照返回的数字
  # [ref] 索引来定位。
  #
  # 需要可选依赖，每个环境安装一次：
