  #   # allow_private_addresses: false # SSRF 防护：生产环境保持 false
  #   # cdp_url: http://127.0.0.1:9222 # 附加到你自己运行中的 Chrome（Codex 风格）
  #   # allow_unguarded_cdp: false      # 使用 cdp_url 时必须设为 true：附加到已有
  #   #                                # 的 Chrome 会让 DeerFlow 无法执行其子资源/
  #   #                                # 重定向 SSRF 防护，而不是启动一个私有的
  #   #                                # 无头实例。启动 Chrome 时加
  #   #                                # --remote-debugging-port=9222，
  #   #                                # 即可看到智能体用你的真实登录会话操作
  #   #                                # 真实浏览器。仅限本地/可信环境；
