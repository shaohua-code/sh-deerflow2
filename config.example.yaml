  # DEERFLOW_IAM_TOKEN_ENCRYPTION_KEY，绝不要写在这里。

# ============================================================================
# 熔断器配置
# ============================================================================
# LLM 调用熔断器防止对故障 Provider 的反复请求。
# 达到失败阈值后，后续调用快速失败直至恢复。
#
# 适用场景：
# - 避免 Provider 故障期间触发限流封禁
# - 减少重试循环造成的资源耗尽
# - LLM 服务不可用时优雅降级

# circuit_breaker:
#   # 熔断打开前允许的连续失败次数（默认：5）
#   failure_threshold: 5
#   # 尝试恢复前的等待秒数（默认：60）
#   recovery_timeout_sec: 60

# ============================================================================
# LLM 调用并发配置
# ============================================================================
# 进程级限制同时在途的 LLM 调用数量。Provider 的突发限流
# （limit_burst_rate）错误看的是请求速率的"斜率"，不是静态配额——
# 早高峰（如 08:30）几秒内从近乎零拉满的速率会被拒绝，即使总 RPM
# 仍在预算内。限制并发就是限制这个斜率。只靠重试会更糟（重试会在
# 正被限流的突发内部追加需求）；请把该上限与 LLM 错误处理中间件
# 内置的去相关抖动退避配合使用，入口侧最好再配一个 nginx
# `limit_req`。
#
# 0 关闭上限（默认）——既有部署行为不变。
#
# 进程级而非集群级：该上限约束单个 Gateway 进程内的在途 LLM 调用。
# GATEWAY_WORKERS > 1 时，部署的总上限实际是
# `max_concurrent_calls * GATEWAY_WORKERS`，多节点部署还会继续放大
# ——设定每进程值时请考虑到这一点（入口配 nginx `limit_req` 才是
# 真正的集群级斜率上限）。
#
# 仅启动时生效：上限在首次 LLM 运行时捕获并在进程生命周期内冻结。
# 修改这里的 `max_concurrent_calls` 只在 Gateway 重启后生效；下方其他
# `llm_call.*` 旋钮仍支持热更新。冻结上限是为了避免运行时可变的
# 进程级/跨事件循环限流器会遇到的缩容与配置新鲜度竞态（调低的限额
# 可能继续放行排队等待者，或晚构建的过期配置快照恢复更高的限额）。

# llm_call:
#   # 整个进程同时在途的 LLM 调用上限（默认：0 = 关闭）
#   max_concurrent_calls: 0
#   # 可重试瞬时错误的最大尝试次数，1 = 不重试（默认：3）
#   retry_max_attempts: 3
#   # 去相关抖动重试退避的基础延迟（毫秒）（默认：1000）
#   retry_base_delay_ms: 1000
#   # 单次重试退避延迟的硬上限（毫秒）（默认：8000）
#   retry_cap_delay_ms: 8000
#   # 仅供突发限流（limit_burst_rate）429 使用的退避基数（毫秒）——
#   # 高于 retry_base_delay_ms，让单次突发重试落在限流窗口消退之后。
#   # Provider 返回 Retry-After 时忽略该值（默认：5000）
#   burst_retry_base_delay_ms: 5000

# ============================================================================
# SSO / OIDC 认证（可选）
# ============================================================================
# 通过任意 OIDC 兼容 Provider 启用 SSO 登录（Keycloak、Google、
# Azure AD、Okta 等）。
# 启用后，登录页会在标准邮箱/密码表单旁展示 SSO 按钮。
#
# Provider 配置：
#   - issuer:      OIDC issuer URL（如 https://keycloak.example.com/realms/deerflow）
#   - client_id:   Provider 发放的 OAuth2 client ID
#   - client_secret: OAuth2 client secret（支持 $ENV_VAR 引用）
#   - redirect_uri: 回调地址。生产环境必须与 Provider 中配置的一致；
#                   开发环境默认自行推导。
#
# Keycloak 配置步骤：
#   1. 创建 "confidential" 类型且启用 Standard Flow 的客户端
#   2. 添加 Valid Redirect URI：http://localhost:8001/api/v1/auth/callback/keycloak
#   3. 添加 Web Origin：http://localhost:8001（或你的前端地址）

# ============================================================================
# 本地（邮箱/密码）认证
# ============================================================================
# POST /api/v1/auth/register 的自助注册默认开放：能访问 Gateway 的
# 任何人都可以创建普通用户账号。
#
# 下方的 OIDC 开通策略（allowed_email_domains、require_verified_email、
# auto_create_users）仅在 SSO 回调中强制执行。它不约束本地注册，
# 因此在 SSO 开通的部署上保持开放会让访客绕过该策略创建账号。
# 请在那里设置 allow_registration: false。
#
# 首个管理员账号总是通过 /initialize 创建，不受此设置影响，
# 因此关闭它不会把你锁在新安装的系统之外。

# auth:
#   local:
#     allow_registration: false
#     # 按客户端 IP 的登录限流（进程内，按 worker）。许多用户共享同一
#     # 出口 IP（公司代理 / NAT）时请调高 max_login_attempts，避免
#     # 共享 IP 被锁殃及整个办公室；要更严格就调低（最小 2——单次失败
#     # 绝不能锁住一个 IP，否则一个手误就会封住共享出口）。
#     # 默认值保持历史上的硬编码策略（5 次失败 / 5 分钟）。每次登录
#     # 实时读取，因此配置热更新即可生效、无需重启 Gateway：调低
#     # lockout_seconds 会提前释放生效中的锁，收紧 max_login_attempts
#     # 保留已计入的失败；调高 lockout_seconds 会延长仍在生效的锁，
#     # 但不会复活已过期的锁。
#     # max_login_attempts: 5
#     # lockout_seconds: 300
#
#   oidc:
#     enabled: true
#     # 前端基础地址，用于 SSO 回调后的重定向。
#     # 生产环境在反向代理之后时，设为公开的前端地址
#     # （如 https://deerflow.example.com）。开发环境保持不设。
#     # frontend_base_url: http://localhost:3000
#     providers:
#       keycloak:
#         display_name: Keycloak
#         issuer: https://keycloak.example.com/realms/deerflow
#         client_id: deerflow
#         client_secret: $KEYCLOAK_CLIENT_SECRET
#         # 可选：显式设置回调地址。
#         # redirect_uri: https://deerflow.example.com/api/v1/auth/callback/keycloak
#         scopes:
#           - openid
#           - email
#           - profile
#           # 需要登录后授权的 IAM 集成，还要请求 offline_access，并在下方
#           # 显式启用 token 保管。
#           # - offline_access
#         token_endpoint_auth_method: client_secret_post
#         # 普通社交 OIDC Provider 保持 false。仅 IAM 设为 true，并把
#         # DEERFLOW_IAM_TOKEN_ENCRYPTION_KEY 注入 Gateway API 环境
#         # （随机 32 字节密钥的 Base64；绝不要写进本文件）。
#         # iam_token_vault_enabled: true
#
#         # 用户开通设置（安全默认值如下）：
#         auto_create_users: true          # 首次 SSO 登录时自动创建 DeerFlow 账号
#         require_verified_email: true     # 拒绝未验证邮箱的 SSO 登录
#         # allowed_email_domains:          # 限定允许的邮箱域名
#         #   - example.com
#         # admin_emails 仅为向后兼容保留，会被忽略。
#         # 基于邮箱的 OIDC 管理员授予已禁用；请通过 IAM 显式分配访问权。
#
#         # 安全特性（默认启用）：
#         pkce_enabled: true               # 授权码流程使用 PKCE（S256）
#         nonce_enabled: true              # ID Token 中的 nonce 校验

# --- 插件 ------------------------------------------------------------------
# 扩展包在启动时按这里的顺序加载一次。每个条目以
# "模块路径:install" 命名一个安装入口；`config` 块原样交给该包，并由包
# 自行校验。
#
# 优先使用扩展管理器，而不是手动编辑这份列表：
#   make extension-install SOURCE="deerflow-extension-acme==1.2.3"
#   make extension-install SOURCE="git+https://github.com/acme/deerflow-extension-acme.git@<commit>"
#   make extension-install SOURCE="/absolute/path/to/local-extension"
#   make extension-list
#   make extension-enable NAME=acme
#   make extension-disable NAME=acme
#   make extension-remove NAME=acme
# 安装器会同时更新 backend/pyproject.toml、backend/uv.lock 和本块。
# 它还会要求运维确认来源可信；扩展及其构建系统以 Gateway 权限执行代码。
#
# 每次安装、启用、停用、移除或手动编辑都需要重启 Gateway。开发启动器
# 可能在交接前补拉缺失的锁定产物；构建好的生产 Gateway 绝不会在启动时
# 安装插件。本地目录会被复制到 backend/extensions/sources 作为可部署
# 快照；远程来源请用固定版本或公开的 HTTPS Git commit 以保证可复现。
# SSH Git URL 会被拒绝，因为标准 Docker 构建器不转发宿主机 SSH 凭据。
# 加载始终是显式的：未经管理器安装的包在列进这里之前不会有任何效果，
# 列表顺序决定贡献顺序。
#
# 它刻意与上方的 `extensions:` 块（MCP 服务器、技能、配置声明的中间件）
# 分开。后者由 extensions_config.json 支持，Gateway 可以通过 HTTP 端点
# 改写它；会导致代码被导入的列表必须只留在这个运维控制的文件里。
#
# 插件可以贡献语义化放置的中间件、任务生命周期钩子、系统模型观察者、
# Gateway 生命周期服务和急切注册的 FastAPI HTTP 路由。
# 见 examples/deerflow-extension-example，那是一个覆盖全部五类的示例包。
#
# plugins:
#   - name: example                       # PEP 621 entry-point 名称
#     package: deerflow-extension-example # 由 uv 管理的 Python 发行包
#     use: deerflow_extension_example:install
#     enabled: true                       # false 跳过导入与注册
#     required: false                     # true 表示加载失败会中止 Gateway 启动
#                                         # （install --required 即选择加入）
#     table_prefix: example_ext_          # 可选：该扩展在自己的 MetaData/迁移链
#                                         # 下拥有的表名前缀。
#                                         # 让直接对真实数据库执行的
#                                         # `alembic revision --autogenerate`
#                                         # 看不到这些表，从而不会提议删除它们。
#                                         # （`make migrate-rev` 对迁移链构建的
#                                         # 一次性 SQLite 做差异，因此本来就不会
#                                         # 看到它们。）
#                                         # 为空或与宿主表名冲突时在启动时被拒绝。
#     config:
#       label: example                    # 扩展私有的值（如有）
