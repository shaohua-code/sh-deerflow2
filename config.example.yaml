  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10
    # 受限网络 / Docker / WSL 场景的可选代理。
    # 代理跑在宿主机上时，请用 host.docker.internal 代替 127.0.0.1。
    # proxy: $HTTPS_PROXY
    # trust_env: true

