  #   base_url: https://api.novita.ai/openai
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 4096
  #   temperature: 0.7
  #   supports_thinking: true
  #   supports_vision: true
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled

  # 示例：StepFun（阶跃星辰）推理模型
  # StepFun 提供 OpenAI 兼容 API 及推理模型。
  # 使用 reasoning_format: deepseek-style 时，API 会返回 reasoning_content
  # （与 DeepSeek 同名字段），多轮工具调用对话中必须把它回放到历史
