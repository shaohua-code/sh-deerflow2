  # Atlas Cloud 用一个 OpenAI 兼容端点聚合了大量开源模型
  # （DeepSeek、Qwen、Kimi、GLM、MiniMax、Llama 等），与其他 OpenAI
  # 兼容网关一样使用 ChatOpenAI + base_url 的组合。
