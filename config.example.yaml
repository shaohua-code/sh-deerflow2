# ============================================================================
# 护栏配置
# ============================================================================
# 工具调用执行前的可选授权。
# 启用后，每次工具调用在执行前都会经过所配置的 Provider。
# 三种选择：内置白名单、OAP 策略 Provider 或自定义 Provider。
# 完整文档见 backend/docs/GUARDRAILS.md。
#
# Provider 通过 resolve_variable 按类路径加载（与模型/工具相同）。

# --- 方式一：内置 AllowlistProvider（零外部依赖） ---
# guardrails:
#   enabled: true
#   provider:
#     use: deerflow.guardrails.builtin:AllowlistProvider
#     config:
#       denied_tools: ["bash", "write_file"]

# --- 方式二：OAP 护照 Provider（开放标准，任意实现） ---
#   Open Agent Passport（OAP）规范定义了护照格式与决策码。
#   任何 OAP 兼容 Provider 都可用。以 APort（参考实现）为例：
#     pip install aport-agent-guardrails && aport setup --framework deerflow
# guardrails:
#   enabled: true
#   provider:
#     use: aport_guardrails.providers.generic:OAPGuardrailProvider

# --- 方式三：自定义 Provider（任何带 evaluate/aevaluate 方法的类） ---
# guardrails:
#   enabled: true
#   provider:
#     use: my_package:MyGuardrailProvider
#     config:
#       key: value

# ============================================================================
# 授权配置
# ============================================================================
# 细粒度资源授权（RBAC 及 beyond）。默认关闭；
# 每个已认证用户可访问全部资源。
# 见 RFC：https://github.com/bytedance/deer-flow/issues/4063
#
# authorization:
#   enabled: true
#   fail_closed: true            # Provider 出错 / 身份未解析时拦截
#   default_role: user           # user_role 为 None 时应用；内置 RBAC 要求下方存在该角色
#   provider:
#     use: deerflow.authz.rbac:RbacAuthorizationProvider
#     config:
#       # 已知角色对某个资源没有策略时，该资源对其不受限。
#       # 需要约束访问的地方请同时定义 `tools` 和 `routes`。
#       roles:
#         admin:
#           tools: {allow: "*"}
#           routes: {allow: "*"}
#           models: {allow: "*"}
#           sandbox: {allow: "*"}
#         user:
#           tools: {allow: "*", deny: ["update_agent"]}
#           routes: {allow: "*"}
#           models: {allow: "*"}
#           sandbox: {allow: "*"}
#         guest:
#           # 仅网页角色：依赖沙箱的工具（read_file、bash、glob、
#           # grep、write_file 等）直接省略——sandbox:execute 被拒后
#           # 它们只会返回拒绝错误，因此只放开非沙箱工具。
#           tools: {allow: ["web_search"]}
#           routes: {allow: ["threads:read", "runs:read"]}
#           models: {allow: ["gpt-4o-mini"]}
#           sandbox: {allow: false}  # 拒绝沙箱执行
authorization:
  enabled: false
  # 中央 IAM 试点（在 IAM 应用与权限开通之前保持关闭；授权必须在 IAM
  # 中显式分配）：
  # enabled: true
  # fail_closed: true
  # default_role: user
  # provider:
  #   use: deerflow.authz.iam_deerflow:DeerFlowIamAuthorizationProvider
  #   config:
  #     api_base_url: https://iam.example.com
  #     application_id: REPLACE_WITH_DEERFLOW_IAM_APPLICATION_UUID
  #     oidc_provider: central-iam
  #     timeout_seconds: 3
  #     # 模型列表可见性与模型调用权相互独立。
  #     filter_actions: {model: list}
  #     # 键与 config.models[].name 对应；值为该租户 IAM 目录中的模型
  #     # UUID。未映射的模型在使用前 fail closed。
  #     # 可选的模型用量集成。在 IAM 的服务端到服务端密钥与配额策略
  #     # 开通之前保持关闭。
  #     # 启用时，在 API 环境中设置 IAM_MODEL_USAGE_API_KEY，并为每个
  #     # 已映射模型配置一个明确的输出预留上限。
  #     model_usage:
  #       enabled: false
  #       # 成功投递的发件箱副本在这么多天后清除。
  #       outbox_retention_days: 30
  #       reserved_output_tokens:
  #         gpt-4o: 2048
  #     permission_map:
  #       "route:read:preferences:read": deerflow.preference.read
  #       "route:write:preferences:write": deerflow.preference.write
  #       "route:read:projects:read": deerflow.project.read
  #       "route:write:projects:write": deerflow.project.write
  #       "route:delete:projects:delete": deerflow.project.delete
  #       "route:read:threads:read": deerflow.thread.read
  #       "route:write:threads:write": deerflow.thread.write
  #       "route:delete:threads:delete": deerflow.thread.delete
  #       "route:create:runs:create": deerflow.run.create
  #       "route:read:runs:read": deerflow.run.read
  #       "route:cancel:runs:cancel": deerflow.run.cancel
  #       "route:read:agents:read": deerflow.agent.read
  #       "route:write:agents:write": deerflow.agent.write
  #       "route:delete:agents:delete": deerflow.agent.delete
  #       "route:admin:agents:admin": deerflow.agent.admin  # 仅部署级 USER.md
  #       "route:read:memory:read": deerflow.memory.read
  #       "route:write:memory:write": deerflow.memory.write
  #       "route:delete:memory:delete": deerflow.memory.delete
  #       "route:admin:memory:admin": deerflow.memory.admin
  #       "route:read:channels:read": deerflow.channel.read
  #       "route:write:channels:write": deerflow.channel.write
  #       "route:admin:channels:admin": deerflow.channel.admin
  #       "route:read:integrations:read": deerflow.integration.read
