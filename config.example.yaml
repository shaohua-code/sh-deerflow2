  #       thinking:
  #         type: disabled

  # 示例：vLLM 0.19.0（OpenAI 兼容，支持思考开关）
  # DeerFlow 的 vLLM Provider 会在工具调用各轮之间保留 vLLM 推理内容，
  # 并通过写入 extra_body.chat_template_kwargs.enable_thinking=true/false
  # 来开关 Qwen 风格的思考。
  # 部分推理模型还要求服务端以
  # `vllm serve ... --reasoning-parser <parser>` 方式启动。
