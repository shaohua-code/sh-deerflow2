# DeerFlow 应用配置
#
# 使用说明：
# - 将本文件复制为 `config.yaml`，并按你的环境进行定制
# - 本配置文件默认路径为项目根目录下的 `config.yaml`。
#   可通过 `DEER_FLOW_PROJECT_ROOT` 显式指定项目根目录，或用
#   `DEER_FLOW_CONFIG_PATH` 指向某个具体配置文件。
# - 运行时状态默认存放在项目根目录下的 `.deer-flow`。如需其他可写数据
#   目录，可用 `DEER_FLOW_HOME` 覆盖。
# - 将 `DEER_FLOW_DATE_TIMEZONE` 设为 IANA 时区名（如 `Asia/Shanghai`），
#   可让注入智能体的会话日期遵循与服务器本地时区不同的时区。该变量由
#   日期上下文中间件在运行时读取（不是配置 schema 字段），因此可以直接
#   在容器上设置，无需挂载 `config.yaml`。
# - 所有字段值都支持环境变量。示例：`api_key: $OPENAI_API_KEY`
# - `use` 路径是形如 "包名.子包名.模块名:类名/变量名" 的字符串。

# ============================================================================
# 配置版本（用于检测配置文件是否过期）
# ============================================================================
# 配置 schema 变化时递增此数字。
# 运行 `make config-upgrade` 可把新字段合并进你本地的 config.yaml。
config_version: 45

# 可选的按模型请求节流（写在某个 models[] 条目内部）：
# request_admission:
#   requests_per_minute: 60
#   group: shared-provider-account  # 可选；默认取该模型的配置名
#   max_wait_seconds: 300
#   max_queue_size: 256
# 不配置即关闭。共享 group 要求各模型设置完全一致；修改后需重启。
# 仅进程内 RPM 限流，不涉及 TPM 或跨实例配额。参见
# backend/docs/CONFIGURATION.md 的 "Model request admission" 一节。

# ============================================================================
# 日志
# ============================================================================
# deerflow 模块的日志级别（debug/info/warning/error）
log_level: info

# Trace id 始终会生成，并始终通过 `X-Trace-Id` 响应头返回；本块只控制
# 日志输出——即日志记录是否携带 `trace_id` 字段及其格式。默认关闭，
# 因为开启会改变日志格式。修改后需重启（见 reload_boundary.py）。
logging:
  enhance:
    enabled: false
    format: text

# ============================================================================
# 智能体扩展
# ============================================================================
# 可选的 AgentMiddleware 类，会在内置运行时中间件之后、安全/澄清收尾
# 之前，加载进主智能体与子智能体的中间件链。缺失的包、无效的类或损坏
# 的模块会在智能体创建时报出可操作的导入错误；构造函数异常则携带原始
# 异常在创建时失败。
# 同一份列表同时作用于主智能体与子智能体运行时；目前不支持只为其中
# 一方配置。每个条目是类路径，或带构造参数的 `{class, kwargs}`。kwargs
# 值必须是 JSON 类型（对象、数组、字符串、数字、布尔或 null）；YAML
# 日期与时间戳会被转换为 ISO 字符串以匹配 JSON。中间件类会执行代码，
# 请将其视为受信任的运维配置。
# 取消下面注释即可在 config.yaml 中定义中间件。保持注释状态时，
# extensions_config.json 仍是这个固定槽位（未废弃）中间件列表的事实来源。
# 打包插件则使用下方的 `plugins:` 块。
# extensions:
#   middlewares:
#     - my_company.deerflow_middlewares:DomainGuardMiddleware
#     - class: my_company.deerflow_middlewares:LatencyStampingMiddleware
#       kwargs:
#         header: X-DeerFlow-Latency

# ============================================================================
# 追踪 / 可观测性（Monocle）
# ============================================================================
# 可选的智能体追踪，基于 Monocle。通过环境变量配置
# （MONOCLE_TRACING、MONOCLE_EXPORTERS、OKAHU_API_KEY——与
# LangSmith/Langfuse 同类），不使用 config.yaml 键，且默认关闭。
# 设置方法、各 exporter 捕获的内容及追踪数据去向见
# README.md → "Monocle Tracing"。

# ============================================================================
# Token 用量
# ============================================================================
# 启用 token 用量的采集与展示。
# 开启后，DeerFlow 会记录每次模型调用的输入/输出/总 token 数，并在
# Provider 返回用量元数据时在工作台界面中展示。
token_usage:
  enabled: true

# ============================================================================
# Token 预算 —— 单次运行 token 上限
# ============================================================================
# 通过单次运行的硬性 token 上限防止 API 费用失控。
# 越过 warn_threshold 时，智能体会在上下文内收到一条警告。
# 越过 hard_stop_threshold 时，工具调用会被剥离，智能体被要求立即
# 产出最终回答。
token_budget:
  enabled: false                # 设为 true 启用预算强制执行
  max_tokens: 200000            # 每次运行的总 token 上限（输入 + 输出）
  max_input_tokens: null        # 可选的仅输入上限
  max_output_tokens: null       # 可选的仅输出上限
  warn_threshold: 0.8           # 用到预算 80% 时警告
  hard_stop_threshold: 1.0      # 用到预算 100% 时强制停止

# ============================================================================
# 递归上限
# ============================================================================
# 一次运行的 recursion_limit 限制 LangGraph 超级步（每步至少一次 LLM
# 调用）的数量。客户端可按请求覆盖默认值；非法或非正的客户端取值会
# 回退到这里的配置默认值。
recursion_limit: 100

# Gateway 绝不信任超过该上限的配置值或客户端值，以防止 API 费用失控
# 或 DoS。只有在确实运行极深的子智能体嵌套图时才调高。
max_recursion_limit: 1000


# ============================================================================
# 模型配置
# ============================================================================
# 为智能体配置可用的 LLM 模型。
#
# 两个 token 字段形似但含义不同：
# - `max_tokens` 是传给 Provider 的单次调用输出上限。
# - `context_window` 是正整数，表示总上下文容量（提示 + 补全）。它驱动
#   聊天界面里实时的"上下文已用百分比"指示，并写入模型的 langchain
#   profile；按比例触发的摘要（`summarization.trigger: [{type: fraction, ...}]`）
#   就从该 profile 解析阈值。第三方 OpenAI 兼容模型没有内置 profile，
#   不配置 `context_window` 时，fraction 触发器会降级（丢弃并告警），
#   而不是让智能体构建崩溃。
# 若不知道 Provider 的上限，保持 `context_window` 不配置即可，此时不会
# 渲染百分比。请对照 Provider 的模型文档核实所配置的数值。
#
# 可选的按模型定价（驱动工作台控制台的真实成本展示）。在任意模型条目
# 中加一个 `pricing` 块；所有模型必须使用同一种货币。混合货币会禁用
# 成本上报以避免非法求和。价格按每百万 token 计。
#
#   pricing:
#     currency: CNY                    # 控制台展示的 ISO 货币码（CNY、USD 等）
#     input_per_million: 8.0           # 每 1M 输入 token 价格（缓存未命中）
#     output_per_million: 32.0         # 每 1M 输出 token 价格
#     input_cache_hit_per_million: 0.8 # 每 1M 缓存命中输入 token 价格
#                                      # （可选；省略则命中按未命中价计费）

models:
  # 示例：火山引擎（豆包）模型
  # - name: doubao-seed-1.8
  #   display_name: Doubao-Seed-1.8
  #   use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  #   model: doubao-seed-1-8-251228
  #   api_base: https://ark.cn-beijing.volces.com/api/v3
  #   api_key: $VOLCENGINE_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   context_window: 262144     # 提示 + 补全总容量
  #   supports_thinking: true
  #   supports_vision: true
  #   supports_reasoning_effort: true
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled

  # 示例：火山引擎 Coding Plan（一把密钥，多厂商网关）
  # Coding Plan 端点（/api/coding/v3）允许用同一把 API Key 访问豆包、
  # GLM、DeepSeek、Kimi 和 MiniMax 的模型。
  # 各模型的思考/视觉支持可能不同——需按模型单独配置。
  #
  # - name: glm-5.2-cp
  #   display_name: GLM-5.2 (Coding Plan)
  #   use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  #   model: glm-5.2
  #   api_base: https://ark.cn-beijing.volces.com/api/coding/v3
  #   api_key: $VOLCENGINE_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   supports_thinking: true
  #   supports_vision: false
  #   supports_reasoning_effort: true
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled
  #
  # - name: deepseek-v4-pro-cp
  #   display_name: DeepSeek-V4-Pro (Coding Plan)
  #   use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  #   model: deepseek-v4-pro
  #   api_base: https://ark.cn-beijing.volces.com/api/coding/v3
  #   api_key: $VOLCENGINE_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   supports_thinking: true
  #   supports_vision: false
  #   supports_reasoning_effort: true
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled

  # 示例：Z.AI GLM-5.3-Flash（必须开启思考的变通配置）
  #
  # GLM-5.3-Flash 无法关闭思考，且只接受 low/high/max 三档力度。
  # DeerFlow 当前通用界面可能请求关闭思考或发出 minimal/medium 档，
  # 因此该配置无条件保持思考开启，并抑制通用力度参数转发。请把思考块
  # 留在基础 extra_body 中：移到 when_thinking_enabled 会让后台调用拼出
  # 非法的 thinking.type=disabled + reasoning_effort=minimal 组合。
  # clear_thinking=true 是这个兼容变通有意为之：它避免摘要后还要求精确
  # 重放历史推理内容。
  #
  # - name: glm-5.3-flash
  #   display_name: GLM-5.3-Flash
  #   use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  #   model: glm-5.3-flash
  #   api_base: https://api.z.ai/api/paas/v4
  #   api_key: $ZAI_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   temperature: 1.0
  #   top_p: 0.95
  #   max_tokens: 131072
  #   context_window: 1000000
  #   supports_thinking: true
  #   supports_reasoning_effort: false
  #   supports_vision: true
  #   stream_usage: false
  #   extra_body:
  #     thinking:
  #       type: enabled
  #       clear_thinking: true
  #     tool_stream: true

  # 示例：OpenAI 模型
  # - name: gpt-4
  #   display_name: GPT-4
  #   use: langchain_openai:ChatOpenAI
  #   model: gpt-4
  #   api_key: $OPENAI_API_KEY # 使用环境变量
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 4096          # 单次调用输出上限
  #   context_window: 128000    # 提示 + 补全总容量
  #   temperature: 0.7
  #   supports_vision: true # 为 view_image 工具启用视觉支持

  # 示例：OpenAI Responses API 模型
  # - name: gpt-5-responses
  #   display_name: GPT-5 (Responses API)
  #   use: langchain_openai:ChatOpenAI
  #   model: gpt-5
  #   api_key: $OPENAI_API_KEY
  #   request_timeout: 600.0
  #   max_retries: 2
  #   use_responses_api: true
  #   output_version: responses/v1
  #   # 可选，原样转发给 ChatOpenAI（默认 false）：只发送新一轮消息加
  #   # previous_response_id，而不是重放全部历史。链式上下文仍按输入
  #   # token 计费，且任何客户端侧历史改写（如被拦截写入的载荷省略）
  #   # 只有在重放历史时才会生效。
  #   use_previous_response_id: false
  #   context_window: 400000
  #   supports_vision: true

  # 示例：Ollama（原生 Provider——保留思考/推理内容）
  #
  # 重要：Ollama 模型请使用 langchain_ollama:ChatOllama，而不是
  # langchain_openai:ChatOpenAI。OpenAI 兼容端点（/v1/chat/completions）
  # 不会把 reasoning_content 作为独立字段返回——思考内容要么被压平进
  # <think> 标签，要么整体丢失（ollama/ollama#15293）。Ollama 原生 API
  # （/api/chat）才能正确地把思考与回答内容分开。
  #
  # 安装：cd backend && uv pip install 'deerflow-harness[ollama]'
  #
  # - name: qwen3-local
  #   display_name: Qwen3 32B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: qwen3:32b
  #   base_url: http://localhost:11434   # 不带 /v1 后缀——使用原生 /api/chat
  #   num_predict: 8192
  #   temperature: 0.7
  #   reasoning: true                    # 向 Ollama 原生 API 传 think:true
  #   context_window: 32768              # 与 Ollama 实际服务的上下文长度一致
  #   supports_thinking: true
  #   supports_vision: false
  #
  # - name: gemma4-local
  #   display_name: Gemma 4 27B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: gemma4:27b
  #   base_url: http://localhost:11434
  #   num_predict: 8192
  #   temperature: 0.7
  #   reasoning: true
  #   context_window: 32768
  #   supports_thinking: true
  #   supports_vision: true
  #
  # Docker 部署时请用 host.docker.internal 代替 localhost：
  #   base_url: http://host.docker.internal:11434

  # 示例：Anthropic Claude 模型（含扩展思考）
  # 必须设置 supports_thinking: true——否则即使界面打开了思考开关，
  # DeerFlow 也会静默回退到非思考模式。
  # thinking.type=enabled 时 Anthropic API 必须提供 budget_tokens
  # （服务端无默认值；最小 1024；必须小于 max_tokens）。
  # - name: claude-sonnet-4
  #   display_name: Claude Sonnet 4
  #   use: langchain_anthropic:ChatAnthropic
  #   model: claude-sonnet-4-20250514
  #   api_key: $ANTHROPIC_API_KEY
  #   default_request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 16000         # 单次调用输出上限
  #   context_window: 200000    # 提示 + 补全总容量
  #   supports_vision: true
  #   supports_thinking: true
  #   when_thinking_enabled:
  #     thinking:
  #       type: enabled
  #       budget_tokens: 4096   # 必填；最小 1024；必须小于 max_tokens
  #   when_thinking_disabled:
  #     thinking:
  #       type: disabled

  # 示例：Google Gemini 模型（原生 SDK，不支持思考开关）
  # - name: gemini-2.5-pro
  #   display_name: Gemini 2.5 Pro
  #   use: langchain_google_genai:ChatGoogleGenerativeAI
  #   model: gemini-2.5-pro
  #   gemini_api_key: $GEMINI_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 8192
  #   context_window: 1048576
  #   supports_vision: true

  # 示例：经 OpenAI 兼容网关的 Gemini 模型（支持思考开关）
  # 请使用 PatchedChatOpenAI，以便在多轮工具调用对话中保留 tool_calls 上的
  # thought_signature 值——开启思考时 Gemini API 有此要求。参见：
  # https://docs.cloud.google.com/vertex-ai/generative-ai/docs/thought-signatures
  # - name: gemini-2.5-pro-thinking
  #   display_name: Gemini 2.5 Pro (Thinking)
  #   use: deerflow.models.patched_openai:PatchedChatOpenAI
  #   model: google/gemini-2.5-pro-preview   # 你的网关所期望的模型名
  #   api_key: $GEMINI_API_KEY
  #   base_url: https://<your-openai-compat-gateway>/v1
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 16384
  #   context_window: 1048576
  #   supports_thinking: true
  #   supports_vision: true
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled

  # 示例：小米 MiMo 模型（支持思考）
  # MiMo 思考模式会返回 reasoning_content，并要求在多轮智能体/工具调用
  # 对话中把该字段回放到历史 assistant 消息上。请使用 PatchedChatMiMo 而
  # 不是普通 ChatOpenAI。
  # 按量付费的 `sk-...` 密钥请使用 https://api.xiaomimimo.com/v1。
  # Token Plan 的 `tp-...` 密钥请使用对应的区域 URL（例如
  # https://token-plan-cn.xiaomimimo.com/v1）。
  # PatchedChatMiMo 不区分模型 ID；配置的每个 MiMo 思考模型条目（例如
  # mimo-v2.5-pro、mimo-v2.5、mimo-v2-pro、mimo-v2-omni 或 mimo-v2-flash）
  # 都应使用它，包括子智能体模型覆盖里引用的模型。
  # 参见：https://platform.xiaomimimo.com/docs/en-US/usage-guide/passing-back-reasoning_content
  # - name: mimo-v2.5-pro
  #   display_name: MiMo V2.5 Pro
  #   use: deerflow.models.patched_mimo:PatchedChatMiMo
  #   model: mimo-v2.5-pro
  #   api_key: $MIMO_API_KEY
  #   base_url: https://api.xiaomimimo.com/v1
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 8192
  #   supports_thinking: true
  #   supports_vision: false
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled

  # 示例：DeepSeek V4 模型（支持思考）
  # - name: deepseek-v4
  #   display_name: DeepSeek V4 (Thinking)
  #   use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  #   model: deepseek-v4-pro
