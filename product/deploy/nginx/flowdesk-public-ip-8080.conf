# Temporary IP-only ingress for Flow Desk.
# Keep the application container bound to loopback; the host Nginx owns the
# public port so the existing IAM HTTPS virtual host is left unchanged.
server {
    listen 8080;
    listen [::]:8080;
    server_name 175.178.62.55 _;

    location / {
        proxy_pass http://127.0.0.1:2026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
